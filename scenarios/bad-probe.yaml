# runs fine but the readiness probe hits a missing path: Running 0/1 Ready,
# DeploymentReplicasUnavailable alert, healthy-looking logs (a misconfiguration, not a crash)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bad-probe
  namespace: scenarios
  labels: {app.kubernetes.io/name: bad-probe, scenario: "true"}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: bad-probe}
  template:
    metadata:
      labels: {app.kubernetes.io/name: bad-probe, scenario: "true"}
    spec:
      containers:
        - name: app
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /nope, port: http}
            periodSeconds: 3
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
