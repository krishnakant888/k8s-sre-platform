# allocates memory until the kernel kills it: PodOOMKilled alert, exit code 137
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oom
  namespace: scenarios
  labels: {app.kubernetes.io/name: oom, scenario: "true"}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: oom}
  template:
    metadata:
      labels: {app.kubernetes.io/name: oom, scenario: "true"}
    spec:
      containers:
        - name: app
          image: busybox:1.37.0
          command:
            - sh
            - -c
            - |
              echo '{"level":"info","service":"oom","msg":"allocating memory"}'
              tail /dev/zero
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 20Mi}
