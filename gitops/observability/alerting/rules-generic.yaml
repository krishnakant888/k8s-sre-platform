# Alert rules that cover every workload, node and cluster, with no application named. Generated by scripts/gen_alert_rules.py;
# edit the script, not this file. Every query keeps the cluster, namespace and pod labels, which the SRE agent uses to
# decide where to look. The SLO rules of orders-api are in rules-orders-api.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: alerting-rules-generic
  namespace: observability
  labels:
    grafana_alert: "1"
data:
  rules-generic.yaml: |
    apiVersion: 1
    groups:
      - orgId: 1
        name: workloads
        folder: Alerts
        interval: 1m
        rules:
          - uid: generic-container-waiting
            title: ContainerWaiting
            condition: C
            data:
              - refId: A
                relativeTimeRange: {from: 600, to: 0}
                datasourceUid: mimir
                model: {refId: A, expr: "max by (cluster, namespace, pod, container, reason) (kube_pod_container_status_waiting_reason{reason=~\"CrashLoopBackOff|ImagePullBackOff|ErrImagePull|CreateContainerConfigError|CreateContainerError|InvalidImageName\"}) == 1", instant: true}
              - refId: C
                datasourceUid: __expr__
                model: {refId: C, type: math, expression: "$A >= 0"}
            noDataState: OK
            execErrState: Error
            for: 3m
            labels: {severity: ticket}
            annotations:
              summary: "{{ $labels.pod }} cannot start: {{ $labels.reason }}"
              description: "Container {{ $labels.container }} in {{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.cluster }}) is stuck waiting with {{ $labels.reason }}."
          - uid: generic-pod-pending
            title: PodStuckPending
            condition: C
            data:
              - refId: A
                relativeTimeRange: {from: 600, to: 0}
                datasourceUid: mimir
                model: {refId: A, expr: "sum by (cluster, namespace, pod) (kube_pod_status_phase{phase=~\"Pending|Unknown\"}) > 0", instant: true}
              - refId: C
                datasourceUid: __expr__
                model: {refId: C, type: math, expression: "$A >= 0"}
            noDataState: OK
            execErrState: Error
            for: 10m
            labels: {severity: ticket}
            annotations:
              summary: "{{ $labels.pod }} has not started for 10 minutes"
              description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.cluster }}) is Pending or Unknown."
          - uid: generic-pod-unschedulable
            title: PodUnschedulable
            condition: C
            data:
              - refId: A
                relativeTimeRange: {from: 600, to: 0}
                datasourceUid: mimir
                model: {refId: A, expr: "max by (cluster, namespace, pod) (kube_pod_status_unschedulable) == 1", instant: true}
              - refId: C
                datasourceUid: __expr__
                model: {refId: C, type: math, expression: "$A >= 0"}
            noDataState: OK
            execErrState: Error
            for: 5m
            labels: {severity: ticket}
            annotations:
              summary: "{{ $labels.pod }} cannot be scheduled on any node"
              description: "The scheduler cannot place {{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.cluster }}): not enough CPU or memory, a taint, or an affinity rule."
          - uid: generic-deployment-rollout-stuck
            title: DeploymentRolloutStuck
            condition: C
            data:
              - refId: A
                relativeTimeRange: {from: 600, to: 0}
                datasourceUid: mimir
                model: {refId: A, expr: "max by (cluster, namespace, deployment) (kube_deployment_status_observed_generation != kube_deployment_metadata_generation)", instant: true}
              - refId: C
                datasourceUid: __expr__
                model: {refId: C, type: math, expression: "$A >= 0"}
            noDataState: OK
            execErrState: Error
            for: 10m
            labels: {severity: ticket}
            annotations:
              summary: "Deployment {{ $labels.deployment }} did not finish rolling out"
              description: "The controller has not caught up with the latest spec of {{ $labels.namespace }}/{{ $labels.deployment }} ({{ $labels.cluster }})."
          - uid: generic-statefulset-unavailable
            title: StatefulSetReplicasNotReady
            condition: C
            data:
              - refId: A
                relativeTimeRange: {from: 600, to: 0}
                datasourceUid: mimir
                model: {refId: A, expr: "max by (cluster, namespace, statefulset) (kube_statefulset_status_replicas_ready) < max by (cluster, namespace, statefulset) (kube_statefulset_replicas)", instant: true}
              - refId: C
                datasourceUid: __expr__
                model: {refId: C, type: math, expression: "$A >= 0"}
            noDataState: OK
            execErrState: Error
            for: 10m
            labels: {severity: ticket}
            annotations:
              summary: "StatefulSet {{ $labels.statefulset }} has replicas that are not ready"
              description: "Fewer replicas of {{ $labels.namespace }}/{{ $labels.statefulset }} ({{ $labels.cluster }}) are ready than desired."
          - uid: generic-daemonset-unavailable
            title: DaemonSetPodsUnavailable
            condition: C
            data:
              - refId: A
                relativeTimeRange: {from: 600, to: 0}
                datasourceUid: mimir
                model: {refId: A, expr: "max by (cluster, namespace, daemonset) (kube_daemonset_status_number_unavailable) > 0", instant: true}
              - refId: C
                datasourceUid: __expr__
                model: {refId: C, type: math, expression: "$A >= 0"}
            noDataState: OK
            execErrState: Error
            for: 10m
            labels: {severity: ticket}
            annotations:
              summary: "DaemonSet {{ $labels.daemonset }} is not running on every node"
              description: "{{ $labels.namespace }}/{{ $labels.daemonset }} ({{ $labels.cluster }}) has pods unavailable on some nodes."
          - uid: generic-job-failed
            title: JobFailed
            condition: C
            data:
              - refId: A
                relativeTimeRange: {from: 600, to: 0}
                datasourceUid: mimir
                model: {refId: A, expr: "max by (cluster, namespace, job_name) (kube_job_status_failed) > 0", instant: true}
              - refId: C
                datasourceUid: __expr__
                model: {refId: C, type: math, expression: "$A >= 0"}
            noDataState: OK
            execErrState: Error
            for: 1m
            labels: {severity: ticket}
            annotations:
              summary: "Job {{ $labels.job_name }} failed"
              description: "{{ $labels.namespace }}/{{ $labels.job_name }} ({{ $labels.cluster }}) has failed pods."
          - uid: generic-memory-near-limit
            title: ContainerMemoryNearLimit
            condition: C
            data:
              - refId: A
                relativeTimeRange: {from: 600, to: 0}
                datasourceUid: mimir
                model: {refId: A, expr: "max by (cluster, namespace, pod, container) (container_memory_working_set_bytes{container!=\"\"}) / max by (cluster, namespace, pod, container) (kube_pod_container_resource_limits{resource=\"memory\"}) > 0.9", instant: true}
              - refId: C
                datasourceUid: __expr__
                model: {refId: C, type: math, expression: "$A >= 0"}
            noDataState: OK
            execErrState: Error
            for: 5m
            labels: {severity: ticket}
            annotations:
              summary: "{{ $labels.pod }} is using over 90% of its memory limit"
              description: "Container {{ $labels.container }} of {{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.cluster }}) will be OOMKilled if it grows further."
          - uid: generic-cpu-throttled
            title: ContainerCpuThrottled
            condition: C
            data:
              - refId: A
                relativeTimeRange: {from: 600, to: 0}
                datasourceUid: mimir
                model: {refId: A, expr: "sum by (cluster, namespace, pod, container) (rate(container_cpu_cfs_throttled_periods_total{container!=\"\"}[5m])) / sum by (cluster, namespace, pod, container) (rate(container_cpu_cfs_periods_total{container!=\"\"}[5m])) > 0.5", instant: true}
              - refId: C
                datasourceUid: __expr__
                model: {refId: C, type: math, expression: "$A >= 0"}
            noDataState: OK
            execErrState: Error
            for: 10m
            labels: {severity: ticket}
            annotations:
              summary: "{{ $labels.pod }} is CPU throttled more than half the time"
              description: "Container {{ $labels.container }} of {{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.cluster }}) hits its CPU limit, which adds latency."
          - uid: generic-pvc-filling
            title: PersistentVolumeFillingUp
            condition: C
            data:
              - refId: A
                relativeTimeRange: {from: 600, to: 0}
                datasourceUid: mimir
                model: {refId: A, expr: "min by (cluster, namespace, persistentvolumeclaim) (kubelet_volume_stats_available_bytes / kubelet_volume_stats_capacity_bytes) < 0.1", instant: true}
              - refId: C
                datasourceUid: __expr__
                model: {refId: C, type: math, expression: "$A >= 0"}
            noDataState: OK
            execErrState: Error
            for: 10m
            labels: {severity: ticket}
            annotations:
              summary: "Volume {{ $labels.persistentvolumeclaim }} has under 10% free"
              description: "{{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} ({{ $labels.cluster }}) is almost full."
          - uid: generic-pvc-full
            title: PersistentVolumeAlmostFull
            condition: C
            data:
              - refId: A
                relativeTimeRange: {from: 600, to: 0}
                datasourceUid: mimir
                model: {refId: A, expr: "min by (cluster, namespace, persistentvolumeclaim) (kubelet_volume_stats_available_bytes / kubelet_volume_stats_capacity_bytes) < 0.03", instant: true}
              - refId: C
                datasourceUid: __expr__
                model: {refId: C, type: math, expression: "$A >= 0"}
            noDataState: OK
            execErrState: Error
            for: 5m
            labels: {severity: page}
            annotations:
              summary: "Volume {{ $labels.persistentvolumeclaim }} has under 3% free"
              description: "Writes to {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} ({{ $labels.cluster }}) are about to fail."
          - uid: generic-pod-failed
            title: PodFailed
            condition: C
            data:
              - refId: A
                relativeTimeRange: {from: 600, to: 0}
                datasourceUid: mimir
                model: {refId: A, expr: "max by (cluster, namespace, pod) (kube_pod_status_phase{phase=\"Failed\"}) == 1", instant: true}
              - refId: C
                datasourceUid: __expr__
                model: {refId: C, type: math, expression: "$A >= 0"}
            noDataState: OK
            execErrState: Error
            for: 5m
            labels: {severity: ticket}
            annotations:
              summary: "{{ $labels.pod }} is in phase Failed"
              description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.cluster }}) failed, usually evicted by the kubelet or terminated without a restart policy that brings it back."
          - uid: generic-critical-addon-down
            title: CriticalAddonDown
            condition: C
            data:
              - refId: A
                relativeTimeRange: {from: 600, to: 0}
                datasourceUid: mimir
                model: {refId: A, expr: "max by (cluster, namespace, deployment) (kube_deployment_status_replicas_available{namespace=~\"kube-system|ingress-nginx|argocd|kyverno|argo-workflows|sre-agent\"}) == 0", instant: true}
              - refId: C
                datasourceUid: __expr__
                model: {refId: C, type: math, expression: "$A >= 0"}
            noDataState: OK
            execErrState: Error
            for: 2m
            labels: {severity: page}
            annotations:
              summary: "{{ $labels.deployment }} has no available replica"
              description: "{{ $labels.namespace }}/{{ $labels.deployment }} ({{ $labels.cluster }}) is a platform component with no available replica, including when it was scaled to zero."
          - uid: generic-target-down
            title: TargetDown
            condition: C
            data:
              - refId: A
                relativeTimeRange: {from: 600, to: 0}
                datasourceUid: mimir
                model: {refId: A, expr: "max by (cluster, namespace, pod, service, job) (up{job!=\"\"}) == 0", instant: true}
              - refId: C
                datasourceUid: __expr__
                model: {refId: C, type: math, expression: "$A >= 0"}
            noDataState: OK
            execErrState: Error
            for: 5m
            labels: {severity: ticket}
            annotations:
              summary: "{{ $labels.service }} stopped answering its metrics endpoint"
              description: "The metrics of {{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.cluster }}) cannot be scraped: the process is down, hung or blocked by a network policy."
      - orgId: 1
        name: nodes
        folder: Alerts
        interval: 1m
        rules:
          - uid: generic-node-not-ready
            title: NodeNotReady
            condition: C
            data:
              - refId: A
                relativeTimeRange: {from: 600, to: 0}
                datasourceUid: mimir
                model: {refId: A, expr: "max by (cluster, node) (kube_node_status_condition{condition=\"Ready\",status=\"true\"}) == 0", instant: true}
              - refId: C
                datasourceUid: __expr__
                model: {refId: C, type: math, expression: "$A >= 0"}
            noDataState: OK
            execErrState: Error
            for: 2m
            labels: {severity: page}
            annotations:
              summary: "Node {{ $labels.node }} is not ready"
              description: "Pods on {{ $labels.node }} ({{ $labels.cluster }}) are not being served: the kubelet stopped reporting or the node is down."
          - uid: generic-node-pressure
            title: NodePressure
            condition: C
            data:
              - refId: A
                relativeTimeRange: {from: 600, to: 0}
                datasourceUid: mimir
                model: {refId: A, expr: "max by (cluster, node, condition) (kube_node_status_condition{condition=~\"MemoryPressure|DiskPressure|PIDPressure\",status=\"true\"}) == 1", instant: true}
              - refId: C
                datasourceUid: __expr__
                model: {refId: C, type: math, expression: "$A >= 0"}
            noDataState: OK
            execErrState: Error
            for: 2m
            labels: {severity: ticket}
            annotations:
              summary: "Node {{ $labels.node }} reports {{ $labels.condition }}"
              description: "The kubelet on {{ $labels.node }} ({{ $labels.cluster }}) is evicting pods or about to."
          - uid: generic-node-cpu
            title: NodeCpuSaturated
            condition: C
            data:
              - refId: A
                relativeTimeRange: {from: 600, to: 0}
                datasourceUid: mimir
                model: {refId: A, expr: "sum by (cluster, node) (rate(container_cpu_usage_seconds_total{container!=\"\"}[5m])) / on (cluster, node) sum by (cluster, node) (kube_node_status_allocatable{resource=\"cpu\"}) > 0.9", instant: true}
              - refId: C
                datasourceUid: __expr__
                model: {refId: C, type: math, expression: "$A >= 0"}
            noDataState: OK
            execErrState: Error
            for: 10m
            labels: {severity: ticket}
            annotations:
              summary: "Node {{ $labels.node }} uses over 90% of its CPU"
              description: "Workloads on {{ $labels.node }} ({{ $labels.cluster }}) compete for CPU."
          - uid: generic-node-memory
            title: NodeMemoryNearAllocatable
            condition: C
            data:
              - refId: A
                relativeTimeRange: {from: 600, to: 0}
                datasourceUid: mimir
                model: {refId: A, expr: "sum by (cluster, node) (container_memory_working_set_bytes{container!=\"\"}) / on (cluster, node) sum by (cluster, node) (kube_node_status_allocatable{resource=\"memory\"}) > 0.9", instant: true}
              - refId: C
                datasourceUid: __expr__
                model: {refId: C, type: math, expression: "$A >= 0"}
            noDataState: OK
            execErrState: Error
            for: 10m
            labels: {severity: ticket}
            annotations:
              summary: "Node {{ $labels.node }} uses over 90% of its memory"
              description: "{{ $labels.node }} ({{ $labels.cluster }}) is close to evicting pods for memory."
      - orgId: 1
        name: control-plane
        folder: Alerts
        interval: 1m
        rules:
          - uid: generic-apiserver-errors
            title: ApiServerErrors
            condition: C
            data:
              - refId: A
                relativeTimeRange: {from: 600, to: 0}
                datasourceUid: mimir
                model: {refId: A, expr: "sum by (cluster) (rate(apiserver_request_total{code=~\"5..\"}[5m])) / sum by (cluster) (rate(apiserver_request_total[5m])) > 0.05", instant: true}
              - refId: C
                datasourceUid: __expr__
                model: {refId: C, type: math, expression: "$A >= 0"}
            noDataState: OK
            execErrState: Error
            for: 5m
            labels: {severity: page, service: kube-apiserver}
            annotations:
              summary: "The API server of {{ $labels.cluster }} returns errors"
              description: "Over 5% of API requests fail with 5xx in {{ $labels.cluster }}: controllers, deployments and Argo CD are affected."
          - uid: generic-apiserver-slow
            title: ApiServerSlow
            condition: C
            data:
              - refId: A
                relativeTimeRange: {from: 600, to: 0}
                datasourceUid: mimir
                model: {refId: A, expr: "histogram_quantile(0.99, sum by (cluster, le) (rate(apiserver_request_sli_duration_seconds_bucket{verb!~\"WATCH|CONNECT\"}[5m]))) > 1", instant: true}
              - refId: C
                datasourceUid: __expr__
                model: {refId: C, type: math, expression: "$A >= 0"}
            noDataState: OK
            execErrState: Error
            for: 10m
            labels: {severity: ticket, service: kube-apiserver}
            annotations:
              summary: "The API server of {{ $labels.cluster }} is slow"
              description: "The 99th percentile of API requests in {{ $labels.cluster }} is over one second."
          - uid: generic-coredns-errors
            title: CoreDnsErrors
            condition: C
            data:
              - refId: A
                relativeTimeRange: {from: 600, to: 0}
                datasourceUid: mimir
                model: {refId: A, expr: "sum by (cluster) (rate(coredns_dns_responses_total{rcode=\"SERVFAIL\"}[5m])) / sum by (cluster) (rate(coredns_dns_responses_total[5m])) > 0.05", instant: true}
              - refId: C
                datasourceUid: __expr__
                model: {refId: C, type: math, expression: "$A >= 0"}
            noDataState: OK
            execErrState: Error
            for: 5m
            labels: {severity: page, service: coredns}
            annotations:
              summary: "DNS lookups fail in {{ $labels.cluster }}"
              description: "Over 5% of DNS answers are SERVFAIL in {{ $labels.cluster }}: services cannot find each other."
      - orgId: 1
        name: ingress
        folder: Alerts
        interval: 1m
        rules:
          - uid: generic-ingress-errors
            title: IngressHighErrorRate
            condition: C
            data:
              - refId: A
                relativeTimeRange: {from: 600, to: 0}
                datasourceUid: mimir
                model: {refId: A, expr: "sum by (cluster, namespace, ingress, host) (rate(nginx_ingress_controller_requests{status=~\"5..\"}[5m])) / sum by (cluster, namespace, ingress, host) (rate(nginx_ingress_controller_requests[5m])) > 0.05 and sum by (cluster, namespace, ingress, host) (rate(nginx_ingress_controller_requests[5m])) > 0.05", instant: true}
              - refId: C
                datasourceUid: __expr__
                model: {refId: C, type: math, expression: "$A >= 0"}
            noDataState: OK
            execErrState: Error
            for: 5m
            labels: {severity: page}
            annotations:
              summary: "{{ $labels.host }} returns errors to users"
              description: "Over 5% of requests for {{ $labels.host }} (ingress {{ $labels.namespace }}/{{ $labels.ingress }}, {{ $labels.cluster }}) end in 5xx."
          - uid: generic-ingress-slow
            title: IngressSlow
            condition: C
            data:
              - refId: A
                relativeTimeRange: {from: 600, to: 0}
                datasourceUid: mimir
                model: {refId: A, expr: "histogram_quantile(0.95, sum by (cluster, namespace, ingress, le) (rate(nginx_ingress_controller_request_duration_seconds_bucket[5m]))) > 1", instant: true}
              - refId: C
                datasourceUid: __expr__
                model: {refId: C, type: math, expression: "$A >= 0"}
            noDataState: OK
            execErrState: Error
            for: 5m
            labels: {severity: ticket}
            annotations:
              summary: "Ingress {{ $labels.ingress }} is slow"
              description: "The 95th percentile of requests through {{ $labels.namespace }}/{{ $labels.ingress }} ({{ $labels.cluster }}) is over one second."
      - orgId: 1
        name: gitops
        folder: Alerts
        interval: 1m
        rules:
          - uid: generic-argocd-out-of-sync
            title: ArgoAppOutOfSync
            condition: C
            data:
              - refId: A
                relativeTimeRange: {from: 600, to: 0}
                datasourceUid: mimir
                model: {refId: A, expr: "max by (cluster, name, dest_server, project) (argocd_app_info{sync_status!=\"Synced\"}) == 1", instant: true}
              - refId: C
                datasourceUid: __expr__
                model: {refId: C, type: math, expression: "$A >= 0"}
            noDataState: OK
            execErrState: Error
            for: 15m
            labels: {severity: ticket, service: argocd}
            annotations:
              summary: "Argo CD app {{ $labels.name }} is out of sync"
              description: "{{ $labels.name }} (project {{ $labels.project }}, destination {{ $labels.dest_server }}) differs from Git for 15 minutes."
          - uid: generic-argocd-unhealthy
            title: ArgoAppUnhealthy
            condition: C
            data:
              - refId: A
                relativeTimeRange: {from: 600, to: 0}
                datasourceUid: mimir
                model: {refId: A, expr: "max by (cluster, name, dest_server, project, health_status) (argocd_app_info{health_status=~\"Degraded|Missing\"}) == 1", instant: true}
              - refId: C
                datasourceUid: __expr__
                model: {refId: C, type: math, expression: "$A >= 0"}
            noDataState: OK
            execErrState: Error
            for: 5m
            labels: {severity: ticket, service: argocd}
            annotations:
              summary: "Argo CD app {{ $labels.name }} is {{ $labels.health_status }}"
              description: "The resources of {{ $labels.name }} (destination {{ $labels.dest_server }}) are not healthy."
          - uid: generic-argocd-sync-failing
            title: ArgoSyncFailing
            condition: C
            data:
              - refId: A
                relativeTimeRange: {from: 600, to: 0}
                datasourceUid: mimir
                model: {refId: A, expr: "sum by (cluster, name, dest_server) (increase(argocd_app_sync_total{phase=~\"Error|Failed\"}[15m])) > 0", instant: true}
              - refId: C
                datasourceUid: __expr__
                model: {refId: C, type: math, expression: "$A >= 0"}
            noDataState: OK
            execErrState: Error
            for: 1m
            labels: {severity: ticket, service: argocd}
            annotations:
              summary: "Argo CD sync of {{ $labels.name }} is failing"
              description: "A sync of {{ $labels.name }} (destination {{ $labels.dest_server }}) ended in an error in the last 15 minutes."
      - orgId: 1
        name: telemetry
        folder: Alerts
        interval: 1m
        rules:
          - uid: generic-telemetry-missing-platform
            title: ClusterTelemetryMissing
            condition: C
            data:
              - refId: A
                relativeTimeRange: {from: 600, to: 0}
                datasourceUid: mimir
                model: {refId: A, expr: "vector(1) unless on () count(up{job=\"alloy\",cluster=\"platform\"})", instant: true}
              - refId: C
                datasourceUid: __expr__
                model: {refId: C, type: math, expression: "$A >= 0"}
            noDataState: OK
            execErrState: Error
            for: 5m
            labels: {severity: page, cluster: platform, service: alloy}
            annotations:
              summary: "No telemetry from the platform cluster"
              description: "The collector of the platform cluster stopped sending metrics: the cluster, its network path or the collector is down. Everything else in this view is stale until it is back."
          - uid: generic-telemetry-missing-gitops
            title: ClusterTelemetryMissing
            condition: C
            data:
              - refId: A
                relativeTimeRange: {from: 600, to: 0}
                datasourceUid: mimir
                model: {refId: A, expr: "vector(1) unless on () count(up{job=\"alloy\",cluster=\"gitops\"})", instant: true}
              - refId: C
                datasourceUid: __expr__
                model: {refId: C, type: math, expression: "$A >= 0"}
            noDataState: OK
            execErrState: Error
            for: 5m
            labels: {severity: page, cluster: gitops, service: alloy}
            annotations:
              summary: "No telemetry from the gitops cluster"
              description: "The collector of the gitops cluster stopped sending metrics: Argo CD, which deploys everything, may be down."
          - uid: generic-workflow-failed
            title: InvestigationWorkflowFailed
            condition: C
            data:
              - refId: A
                relativeTimeRange: {from: 600, to: 0}
                datasourceUid: mimir
                model: {refId: A, expr: "max by (cluster) (increase(argo_workflows_count{status=~\"Failed|Error\"}[10m])) > 0", instant: true}
              - refId: C
                datasourceUid: __expr__
                model: {refId: C, type: math, expression: "$A >= 0"}
            noDataState: OK
            execErrState: Error
            for: 1m
            labels: {severity: ticket, service: sre-agent, namespace: sre-agent}
            annotations:
              summary: "An incident investigation workflow failed"
              description: "A workflow of the SRE agent ended in Failed or Error: an alert has no report, or only a partial one."
          - uid: generic-remote-write-failing
            title: TelemetryNotDelivered
            condition: C
            data:
              - refId: A
                relativeTimeRange: {from: 600, to: 0}
                datasourceUid: mimir
                model: {refId: A, expr: "sum by (cluster) (rate(prometheus_remote_storage_samples_failed_total[5m])) > 0", instant: true}
              - refId: C
                datasourceUid: __expr__
                model: {refId: C, type: math, expression: "$A >= 0"}
            noDataState: OK
            execErrState: Error
            for: 5m
            labels: {severity: ticket, service: alloy}
            annotations:
              summary: "Metrics from {{ $labels.cluster }} are not reaching Mimir"
              description: "The collector of {{ $labels.cluster }} fails to write samples: Mimir is down or unreachable, or a network policy blocks it."
          - uid: generic-log-write-dropping
            title: LogsDropped
            condition: C
            data:
              - refId: A
                relativeTimeRange: {from: 600, to: 0}
                datasourceUid: mimir
                model: {refId: A, expr: "sum by (cluster) (rate(loki_write_dropped_entries_total[5m])) > 0", instant: true}
              - refId: C
                datasourceUid: __expr__
                model: {refId: C, type: math, expression: "$A >= 0"}
            noDataState: OK
            execErrState: Error
            for: 5m
            labels: {severity: ticket, service: alloy}
            annotations:
              summary: "Logs from {{ $labels.cluster }} are being dropped"
              description: "The collector of {{ $labels.cluster }} drops log lines: Loki is down, unreachable or rate limiting."
