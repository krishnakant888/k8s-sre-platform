# cross-namespace and API server access for the observability namespace of the production cluster.
# default-deny and same-namespace traffic come from platform-base.
# Mimir, Loki, Tempo and Grafana are not here: they run in the monitoring cluster (gitops/monitoring).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-apiserver-egress
  namespace: observability
spec:
  podSelector:
    matchLabels:
      platform.io/api-access: "true"
  policyTypes: [Egress]
  egress:
    - ports:
        - {port: 443, protocol: TCP}
        - {port: 6443, protocol: TCP}
        - {port: 10250, protocol: TCP}   # kubelet, for cadvisor
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-scrape-egress
  namespace: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: alloy
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - {port: 8080, protocol: TCP}
        - {port: 9090, protocol: TCP}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-otlp-from-workloads
  namespace: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: alloy
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: [demo, sre-agent]
      ports:
        - {port: 4317, protocol: TCP}
        - {port: 4318, protocol: TCP}
---
# alloy ships metrics, logs and traces to the monitoring cluster through NodePorts on its kind nodes
# (addresses on the shared Docker network, 172.16.0.0/12). In a cloud setup this is an internal load balancer.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ship-to-monitoring
  namespace: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: alloy
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: 172.16.0.0/12
      ports:
        - {port: 30900, protocol: TCP}   # mimir
        - {port: 30310, protocol: TCP}   # loki
        - {port: 30417, protocol: TCP}   # tempo otlp
