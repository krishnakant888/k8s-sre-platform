apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-orders-api
  namespace: observability
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: Services
data:
  orders-api.json: |
    {
      "uid": "orders-api",
      "title": "orders-api: RED and SLO",
      "tags": ["service", "slo"],
      "schemaVersion": 39,
      "version": 1,
      "refresh": "15s",
      "time": {"from": "now-1h", "to": "now"},
      "panels": [
        {"id": 1, "type": "stat", "title": "SLI (good requests, 5m)", "gridPos": {"h": 4, "w": 5, "x": 0, "y": 0},
         "datasource": {"type": "prometheus", "uid": "mimir"},
         "fieldConfig": {"defaults": {"unit": "percentunit", "decimals": 3, "min": 0, "max": 1,
           "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "orange", "value": 0.99}, {"color": "green", "value": 0.995}]}}},
         "targets": [{"expr": "1 - sli:orders_api:error_ratio:rate5m", "refId": "A"}]},
        {"id": 2, "type": "gauge", "title": "Error budget remaining (28d)", "gridPos": {"h": 4, "w": 5, "x": 5, "y": 0},
         "datasource": {"type": "prometheus", "uid": "mimir"},
         "fieldConfig": {"defaults": {"unit": "percentunit", "min": 0, "max": 1,
           "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "orange", "value": 0.25}, {"color": "green", "value": 0.5}]}}},
         "targets": [{"expr": "clamp_min(slo:orders_api:error_budget_remaining, 0)", "refId": "A"}]},
        {"id": 3, "type": "stat", "title": "Burn rate (1h)", "gridPos": {"h": 4, "w": 5, "x": 10, "y": 0},
         "datasource": {"type": "prometheus", "uid": "mimir"},
         "fieldConfig": {"defaults": {"decimals": 1, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "orange", "value": 6}, {"color": "red", "value": 14.4}]}}},
         "targets": [{"expr": "sli:orders_api:error_ratio:rate1h / 0.005", "refId": "A"}]},
        {"id": 4, "type": "stat", "title": "Requests / s", "gridPos": {"h": 4, "w": 4, "x": 15, "y": 0},
         "datasource": {"type": "prometheus", "uid": "mimir"},
         "fieldConfig": {"defaults": {"unit": "reqps", "decimals": 1}},
         "targets": [{"expr": "sli:orders_api:requests_total:rate5m", "refId": "A"}]},
        {"id": 5, "type": "stat", "title": "Ready replicas", "gridPos": {"h": 4, "w": 5, "x": 19, "y": 0},
         "datasource": {"type": "prometheus", "uid": "mimir"},
         "targets": [{"expr": "sum(kube_deployment_status_replicas_available{namespace=\"demo\", deployment=\"orders-api\"})", "refId": "A"}]},
        {"id": 6, "type": "timeseries", "title": "Request rate by route", "gridPos": {"h": 8, "w": 12, "x": 0, "y": 4},
         "datasource": {"type": "prometheus", "uid": "mimir"},
         "fieldConfig": {"defaults": {"unit": "reqps"}},
         "targets": [{"expr": "sum by (route) (rate(http_requests_total{service=\"orders-api\"}[1m]))", "legendFormat": "{{route}}", "refId": "A"}]},
        {"id": 7, "type": "timeseries", "title": "Bad request ratio vs budget", "gridPos": {"h": 8, "w": 12, "x": 12, "y": 4},
         "datasource": {"type": "prometheus", "uid": "mimir"},
         "fieldConfig": {"defaults": {"unit": "percentunit"}},
         "targets": [
           {"expr": "sli:orders_api:error_ratio:rate5m", "legendFormat": "5m", "refId": "A"},
           {"expr": "sli:orders_api:error_ratio:rate1h", "legendFormat": "1h", "refId": "B"},
           {"expr": "vector(0.005)", "legendFormat": "budget (0.5%)", "refId": "C"},
           {"expr": "vector(14.4 * 0.005)", "legendFormat": "fast burn threshold", "refId": "D"}]},
        {"id": 8, "type": "timeseries", "title": "Latency percentiles", "gridPos": {"h": 8, "w": 12, "x": 0, "y": 12},
         "datasource": {"type": "prometheus", "uid": "mimir"},
         "fieldConfig": {"defaults": {"unit": "s"}},
         "targets": [
           {"expr": "histogram_quantile(0.50, sum by (le) (rate(http_request_duration_seconds_bucket{service=\"orders-api\"}[2m])))", "legendFormat": "p50", "refId": "A"},
           {"expr": "histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{service=\"orders-api\"}[2m])))", "legendFormat": "p95", "refId": "B"},
           {"expr": "histogram_quantile(0.99, sum by (le) (rate(http_request_duration_seconds_bucket{service=\"orders-api\"}[2m])))", "legendFormat": "p99", "refId": "C"},
           {"expr": "vector(0.3)", "legendFormat": "SLO threshold", "refId": "D"}]},
        {"id": 9, "type": "timeseries", "title": "Responses by status", "gridPos": {"h": 8, "w": 12, "x": 12, "y": 12},
         "datasource": {"type": "prometheus", "uid": "mimir"},
         "targets": [{"expr": "sum by (status) (rate(http_requests_total{service=\"orders-api\"}[1m]))", "legendFormat": "{{status}}", "refId": "A"}]},
        {"id": 10, "type": "timeseries", "title": "Pod CPU and memory", "gridPos": {"h": 8, "w": 12, "x": 0, "y": 20},
         "datasource": {"type": "prometheus", "uid": "mimir"},
         "targets": [
           {"expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"demo\", container=\"orders-api\"}[2m]))", "legendFormat": "cpu {{pod}}", "refId": "A"},
           {"expr": "sum by (pod) (container_memory_working_set_bytes{namespace=\"demo\", container=\"orders-api\"}) / 1e9", "legendFormat": "mem GB {{pod}}", "refId": "B"}]},
        {"id": 11, "type": "alertlist", "title": "Alerts", "gridPos": {"h": 8, "w": 12, "x": 12, "y": 20},
         "options": {"alertName": "OrdersApi", "dashboardAlerts": false, "stateFilter": {"firing": true, "pending": true, "normal": false}}},
        {"id": 12, "type": "logs", "title": "Errors and warnings (click a trace_id to open the trace)", "gridPos": {"h": 10, "w": 24, "x": 0, "y": 28},
         "datasource": {"type": "loki", "uid": "loki"},
         "options": {"showTime": true, "wrapLogMessage": true, "enableLogDetails": true, "sortOrder": "Descending"},
         "targets": [{"expr": "{namespace=\"demo\", service=\"orders-api\"} | json | level=~\"error|warning\"", "refId": "A"}]}
      ]
    }
