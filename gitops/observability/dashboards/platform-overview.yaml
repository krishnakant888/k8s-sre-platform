apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-platform-overview
  namespace: observability
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: Platform
data:
  platform-overview.json: |
    {
      "uid": "platform-overview",
      "title": "Platform overview",
      "tags": ["platform"],
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {"from": "now-1h", "to": "now"},
      "templating": {"list": [
        {"name": "namespace", "type": "query", "datasource": {"type": "prometheus", "uid": "mimir"},
         "query": "label_values(kube_pod_info, namespace)", "includeAll": true, "multi": true,
         "current": {"text": "All", "value": "$__all"}, "refresh": 2}
      ]},
      "panels": [
        {"id": 1, "type": "stat", "title": "Firing alerts", "gridPos": {"h": 4, "w": 6, "x": 0, "y": 0},
         "datasource": {"type": "prometheus", "uid": "mimir"},
         "targets": [{"expr": "sum(grafana_alerting_alerts{state=\"alerting\"}) or vector(0)", "refId": "A"}],
         "fieldConfig": {"defaults": {"thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 1}]}}}},
        {"id": 2, "type": "stat", "title": "Pods running", "gridPos": {"h": 4, "w": 6, "x": 6, "y": 0},
         "datasource": {"type": "prometheus", "uid": "mimir"},
         "targets": [{"expr": "sum(kube_pod_status_phase{phase=\"Running\", namespace=~\"$namespace\"})", "refId": "A"}]},
        {"id": 3, "type": "stat", "title": "Pods not ready", "gridPos": {"h": 4, "w": 6, "x": 12, "y": 0},
         "datasource": {"type": "prometheus", "uid": "mimir"},
         "targets": [{"expr": "sum(kube_pod_status_ready{condition=\"false\", namespace=~\"$namespace\"}) or vector(0)", "refId": "A"}],
         "fieldConfig": {"defaults": {"thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "orange", "value": 1}]}}}},
        {"id": 4, "type": "stat", "title": "Restarts (1h)", "gridPos": {"h": 4, "w": 6, "x": 18, "y": 0},
         "datasource": {"type": "prometheus", "uid": "mimir"},
         "targets": [{"expr": "sum(increase(kube_pod_container_status_restarts_total{namespace=~\"$namespace\"}[1h]))", "refId": "A"}]},
        {"id": 5, "type": "timeseries", "title": "Container restarts by pod", "gridPos": {"h": 8, "w": 12, "x": 0, "y": 4},
         "datasource": {"type": "prometheus", "uid": "mimir"},
         "targets": [{"expr": "sum by (namespace, pod) (increase(kube_pod_container_status_restarts_total{namespace=~\"$namespace\"}[5m]))", "legendFormat": "{{namespace}}/{{pod}}", "refId": "A"}]},
        {"id": 6, "type": "timeseries", "title": "Memory working set by namespace", "gridPos": {"h": 8, "w": 12, "x": 12, "y": 4},
         "datasource": {"type": "prometheus", "uid": "mimir"},
         "fieldConfig": {"defaults": {"unit": "bytes"}},
         "targets": [{"expr": "sum by (namespace) (container_memory_working_set_bytes{container!=\"\", namespace=~\"$namespace\"})", "legendFormat": "{{namespace}}", "refId": "A"}]},
        {"id": 7, "type": "timeseries", "title": "CPU by namespace (cores)", "gridPos": {"h": 8, "w": 12, "x": 0, "y": 12},
         "datasource": {"type": "prometheus", "uid": "mimir"},
         "targets": [{"expr": "sum by (namespace) (rate(container_cpu_usage_seconds_total{container!=\"\", namespace=~\"$namespace\"}[5m]))", "legendFormat": "{{namespace}}", "refId": "A"}]},
        {"id": 8, "type": "alertlist", "title": "Active alerts", "gridPos": {"h": 8, "w": 12, "x": 12, "y": 12},
         "options": {"alertInstanceLabelFilter": "", "dashboardAlerts": false, "maxItems": 20, "showOptions": "current", "sortOrder": 1, "stateFilter": {"firing": true, "pending": true, "noData": false, "normal": false, "error": true}, "viewMode": "list"}},
        {"id": 9, "type": "logs", "title": "Error logs (all namespaces)", "gridPos": {"h": 10, "w": 24, "x": 0, "y": 20},
         "datasource": {"type": "loki", "uid": "loki"},
         "options": {"showTime": true, "wrapLogMessage": true, "enableLogDetails": true, "sortOrder": "Descending"},
         "targets": [{"expr": "{namespace=~\"$namespace\"} |~ \"(?i)(error|exception|panic|fatal)\"", "refId": "A"}]}
      ]
    }
