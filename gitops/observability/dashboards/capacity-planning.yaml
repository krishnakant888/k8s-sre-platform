apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-capacity-planning
  namespace: observability
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: Platform
data:
  capacity-planning.json: |
    {
      "uid": "capacity-planning",
      "title": "Capacity Planning & Actions",
      "description": "Operational capacity signals, safe sizing decisions, applied actions, and report-linked verification evidence. Live metrics follow Cluster and Namespace; report history is fleet-wide.",
      "tags": ["capacity", "sre-agent", "resources"],
      "schemaVersion": 39,
      "version": 3,
      "editable": true,
      "refresh": "30s",
      "time": {"from": "now-24h", "to": "now"},
      "timezone": "browser",
      "graphTooltip": 1,
      "templating": {
        "list": [
          {
            "name": "cluster",
            "label": "Cluster",
            "type": "query",
            "datasource": {"type": "prometheus", "uid": "mimir"},
            "query": {"query": "label_values(kube_deployment_spec_replicas, cluster)", "refId": "v_cluster"},
            "definition": "label_values(kube_deployment_spec_replicas, cluster)",
            "includeAll": false,
            "multi": false,
            "refresh": 2,
            "sort": 1,
            "current": {"selected": true, "text": "platform", "value": "platform"}
          },
          {
            "name": "namespace",
            "label": "Namespace",
            "type": "query",
            "datasource": {"type": "prometheus", "uid": "mimir"},
            "query": {"query": "label_values(kube_deployment_spec_replicas{cluster=\"$cluster\"}, namespace)", "refId": "v_ns"},
            "definition": "label_values(kube_deployment_spec_replicas{cluster=\"$cluster\"}, namespace)",
            "includeAll": true,
            "multi": true,
            "allValue": ".+",
            "refresh": 2,
            "sort": 1,
            "current": {"selected": true, "text": "demo", "value": "demo"}
          }
        ]
      },
      "panels": [
        {
          "id": 1, "type": "stat", "title": "Reviews held by safety checks (24h)",
          "description": "Fleet-wide count, independent of the Cluster and Namespace selectors. A held review is a protective decision, not a service fault. Open its report to see which safety check blocked a change.",
          "gridPos": {"h": 4, "w": 6, "x": 0, "y": 0},
          "datasource": {"type": "loki", "uid": "loki"},
          "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "thresholds": {"steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 1}, {"color": "red", "value": 5}]}}},
          "targets": [{"expr": "sum(count_over_time({namespace=\"sre-agent\", service=\"sre-agent\"} | json | msg=\"capacity report available\" | decision=\"skipped\" [24h])) or vector(0)", "queryType": "instant", "refId": "A"}]
        },
        {
          "id": 2, "type": "stat", "title": "Containers above 80% memory limit",
          "description": "Number of selected containers above 80% of their configured memory limit now. Green means none; investigate any result above zero in the per-pod memory table.",
          "gridPos": {"h": 4, "w": 6, "x": 6, "y": 0},
          "datasource": {"type": "prometheus", "uid": "mimir"},
          "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "thresholds": {"steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 1}, {"color": "red", "value": 3}]}}},
          "targets": [{"expr": "count(container_memory_working_set_bytes{cluster=\"$cluster\", namespace=~\"$namespace\", container!=\"\", container!=\"POD\"} / on(cluster,namespace,pod,container) kube_pod_container_resource_limits{cluster=\"$cluster\", namespace=~\"$namespace\", resource=\"memory\", container!=\"\", container!=\"POD\"} > 0.8) or vector(0)", "refId": "A", "instant": true}]
        },
        {
          "id": 3, "type": "stat", "title": "Containers throttled above 20%",
          "description": "Selected containers with more than 20% of CPU scheduling periods throttled over 5 minutes. Green means none; inspect the CPU trend and consider a vertical CPU limit change when sustained.",
          "gridPos": {"h": 4, "w": 6, "x": 12, "y": 0},
          "datasource": {"type": "prometheus", "uid": "mimir"},
          "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "thresholds": {"steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 1}, {"color": "red", "value": 3}]}}},
          "targets": [{"expr": "count(sum by (cluster,namespace,pod,container) (rate(container_cpu_cfs_throttled_periods_total{cluster=\"$cluster\", namespace=~\"$namespace\", container!=\"\", container!=\"POD\"}[5m])) / sum by (cluster,namespace,pod,container) (rate(container_cpu_cfs_periods_total{cluster=\"$cluster\", namespace=~\"$namespace\", container!=\"\", container!=\"POD\"}[5m])) > 0.2) or vector(0)", "refId": "A", "instant": true}]
        },
        {
          "id": 4, "type": "stat", "title": "Lowest pod memory headroom",
          "description": "The smallest remaining fraction of a pod memory limit. Green is at least 30% free, yellow is 10–30% free, and red is below 10% free. This is the tightest pod, not an average.",
          "gridPos": {"h": 4, "w": 6, "x": 18, "y": 0},
          "datasource": {"type": "prometheus", "uid": "mimir"},
          "fieldConfig": {"defaults": {"unit": "percentunit", "color": {"mode": "thresholds"}, "thresholds": {"steps": [{"color": "red", "value": null}, {"color": "yellow", "value": 0.1}, {"color": "green", "value": 0.3}]}}},
          "targets": [{"expr": "min(1 - (container_memory_working_set_bytes{cluster=\"$cluster\", namespace=~\"$namespace\", container!=\"\", container!=\"POD\"} / on(cluster,namespace,pod,container) kube_pod_container_resource_limits{cluster=\"$cluster\", namespace=~\"$namespace\", resource=\"memory\", container!=\"\", container!=\"POD\"}))", "refId": "A", "instant": true}]
        },

        {
          "id": 21,
          "type": "text",
          "title": "How to read this dashboard",
          "description": "Metric thresholds, scope, and next actions.",
          "gridPos": {"h": 3, "w": 24, "x": 0, "y": 4},
          "options": {
            "mode": "markdown",
            "content": "**Scope:** Live CPU, memory, and replica panels follow the Cluster and Namespace selectors above. Capacity report counts and history are fleet-wide.\n\n**Healthy signals:** no containers above 80% memory, no containers above 20% CPU throttling, and desired replicas match available replicas. Memory headroom is green at 30% or more free, yellow at 10% to 30%, and red below 10%.\n\n**Read resource values correctly:** memory requests reserve scheduler capacity; limits cap runtime use. A lower limit does not mean the pod uses less memory. Compare the observed 6h peak with the limit. CPU throttle is the fraction of scheduling periods blocked by the CPU limit, not CPU utilization.\n\n**When a signal needs attention:** inspect the affected pod trend and open its capacity report for the measured window, safety decision, PR, and post-change checks. A held review or unverified proposal is a workflow state, not by itself evidence of an outage."
          }
        },        {
          "id": 5,
          "type": "row",
          "title": "Memory",
          "collapsed": false,
          "gridPos": {"h": 1, "w": 24, "x": 0, "y": 7}
        },
        {
          "id": 6, "type": "timeseries", "title": "Memory use as a share of limit",
          "description": "Per-pod working set divided by its configured memory limit. Green is below 60%, yellow 60–80%, red above 80%. A lower limit can raise this percentage even when MiB used is unchanged; compare absolute peak MiB before proposing a change.",
          "gridPos": {"h": 10, "w": 16, "x": 0, "y": 8},
          "datasource": {"type": "prometheus", "uid": "mimir"},
          "fieldConfig": {
            "defaults": {"unit": "percentunit", "min": 0, "custom": {"lineWidth": 2, "fillOpacity": 8},
              "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 0.6}, {"color": "red", "value": 0.8}]}
            }
          },
          "options": {"tooltip": {"mode": "multi"}, "legend": {"displayMode": "table", "placement": "right", "calcs": ["lastNotNull", "max"]}},
          "targets": [
            {"expr": "max by (cluster, namespace, pod, container) (container_memory_working_set_bytes{cluster=\"$cluster\", namespace=~\"$namespace\", container!=\"\", container!=\"POD\"}) / on(cluster,namespace,pod,container) min by (cluster, namespace, pod, container) (kube_pod_container_resource_limits{cluster=\"$cluster\", namespace=~\"$namespace\", resource=\"memory\", container!=\"\", container!=\"POD\"})", "legendFormat": "{{namespace}}/{{pod}}/{{container}}", "refId": "A"}
          ]
        },
        {
          "id": 7, "type": "table", "title": "Per-pod memory use and headroom (MiB)",
          "description": "One row per pod/container. Used and 6h peak are observed MiB; Limit is the runtime ceiling (the request controls scheduling). Used % is color-coded: green <60%, yellow 60–80%, red >80%. Use the report link for the review decision and evidence.",
          "gridPos": {"h": 10, "w": 8, "x": 16, "y": 8},
          "datasource": {"type": "prometheus", "uid": "mimir"},
          "fieldConfig": {
            "defaults": {},
            "overrides": [
              {"matcher": {"id": "byName", "options": "Used"}, "properties": [{"id": "unit", "value": "decmbytes"}, {"id": "custom.width", "value": 90}]},
              {"matcher": {"id": "byName", "options": "Limit"}, "properties": [{"id": "unit", "value": "decmbytes"}, {"id": "custom.width", "value": 90}]},
              {"matcher": {"id": "byName", "options": "Peak 6h"}, "properties": [{"id": "unit", "value": "decmbytes"}, {"id": "custom.width", "value": 90}]},
              {"matcher": {"id": "byName", "options": "Used %"}, "properties": [
                {"id": "unit", "value": "percentunit"},
                {"id": "custom.displayMode", "value": "color-background"},
                {"id": "custom.width", "value": 80},
                {"id": "thresholds", "value": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 0.6}, {"color": "red", "value": 0.8}]}}
              ]}
            ]
          },
          "options": {"sortBy": [{"displayName": "Used %", "desc": true}]},
          "transformations": [
            {"id": "merge", "options": {}},
            {"id": "renameByRegex", "options": {"regex": "Value #A", "renamePattern": "Used"}},
            {"id": "renameByRegex", "options": {"regex": "Value #B", "renamePattern": "Limit"}},
            {"id": "renameByRegex", "options": {"regex": "Value #C", "renamePattern": "Peak 6h"}},
            {"id": "calculateField", "options": {"alias": "Used %", "mode": "reduceRow", "binary": {"left": "Used", "operator": "/", "right": "Limit"}}},
            {"id": "organize", "options": {"excludeByName": {"Time": true, "__name__": true, "cluster": true, "job": true, "instance": true}}}
          ],
          "targets": [
            {"expr": "max by (cluster, namespace, pod, container) (container_memory_working_set_bytes{cluster=\"$cluster\", namespace=~\"$namespace\", container!=\"\", container!=\"POD\"})", "refId": "A", "instant": true, "legendFormat": "{{namespace}} {{pod}} {{container}}"},
            {"expr": "min by (cluster, namespace, pod, container) (kube_pod_container_resource_limits{cluster=\"$cluster\", namespace=~\"$namespace\", resource=\"memory\", container!=\"\", container!=\"POD\"})", "refId": "B", "instant": true, "legendFormat": "{{namespace}} {{pod}} {{container}}"},
            {"expr": "max by (cluster, namespace, pod, container) (max_over_time(container_memory_working_set_bytes{cluster=\"$cluster\", namespace=~\"$namespace\", container!=\"\", container!=\"POD\"}[6h]))", "refId": "C", "instant": true, "legendFormat": "{{namespace}} {{pod}} {{container}}"}
          ]
        },

        {
          "id": 8,
          "type": "row",
          "title": "CPU",
          "collapsed": false,
          "gridPos": {"h": 1, "w": 24, "x": 0, "y": 18}
        },
        {
          "id": 9, "type": "timeseries", "title": "CPU periods throttled (%)",
          "description": "Per-pod fraction of CPU scheduling periods throttled over 5 minutes. Green <20%, yellow 20–50%, red >50%. Sustained throttling with healthy demand can justify a vertical CPU limit increase; this ratio is not CPU utilization.",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 19},
          "datasource": {"type": "prometheus", "uid": "mimir"},
          "fieldConfig": {
            "defaults": {"unit": "percentunit", "min": 0, "max": 1, "custom": {"lineWidth": 2, "fillOpacity": 10},
              "thresholds": {"steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 0.2}, {"color": "red", "value": 0.5}]},
              "color": {"mode": "thresholds"}
            }
          },
          "options": {"tooltip": {"mode": "multi"}},
          "targets": [{"expr": "sum by (cluster, namespace, pod, container) (rate(container_cpu_cfs_throttled_periods_total{cluster=\"$cluster\", namespace=~\"$namespace\", container!=\"\", container!=\"POD\"}[5m])) / sum by (cluster, namespace, pod, container) (rate(container_cpu_cfs_periods_total{cluster=\"$cluster\", namespace=~\"$namespace\", container!=\"\", container!=\"POD\"}[5m]))", "legendFormat": "{{namespace}}/{{pod}}/{{container}}", "refId": "A"}]
        },
        {
          "id": 10, "type": "timeseries", "title": "Desired vs available replicas",
          "description": "Desired replicas are the deployment target; available replicas are currently serving. A gap means rollout or availability is not yet healthy. Scale actions appear as steps.",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 19},
          "datasource": {"type": "prometheus", "uid": "mimir"},
          "fieldConfig": {
            "defaults": {"unit": "short", "min": 0, "decimals": 0, "custom": {"lineWidth": 2, "fillOpacity": 5, "staircase": true}}
          },
          "options": {"tooltip": {"mode": "multi"}},
          "targets": [{"expr": "kube_deployment_spec_replicas{cluster=\"$cluster\", namespace=~\"$namespace\"}", "legendFormat": "{{namespace}}/{{deployment}} desired", "refId": "A"}, {"expr": "kube_deployment_status_replicas_available{cluster=\"$cluster\", namespace=~\"$namespace\"}", "legendFormat": "{{namespace}}/{{deployment}} available", "refId": "B"}]
        },

        {
          "id": 15,
          "type": "row",
          "title": "Capacity plans and post-change verification",
          "collapsed": false,
          "gridPos": {"h": 1, "w": 24, "x": 0, "y": 27}
        },
        {
          "id": 16, "type": "stat", "title": "Capacity reviews written (24h)",
          "description": "Fleet-wide reports written in the last 24 hours; these counts do not follow the Cluster/Namespace selectors. Every table row opens its specific capacity report.",
          "gridPos": {"h": 4, "w": 6, "x": 0, "y": 28},
          "datasource": {"type": "loki", "uid": "loki"},
          "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "thresholds": {"steps": [{"color": "blue", "value": null}]}}},
          "targets": [{"expr": "sum(count_over_time({namespace=\"sre-agent\", service=\"sre-agent\"} | json | msg=\"capacity report available\" [24h])) or vector(0)", "queryType": "instant", "refId": "A"}]
        },
        {
          "id": 17, "type": "stat", "title": "Post-change checks healthy (24h)",
          "description": "Fleet-wide merged capacity actions with all recorded post-merge checks passing. Zero means none were recorded in the time window, not that a failure occurred.",
          "gridPos": {"h": 4, "w": 6, "x": 6, "y": 28},
          "datasource": {"type": "loki", "uid": "loki"},
          "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "thresholds": {"steps": [{"color": "green", "value": null}]}}},
          "targets": [{"expr": "sum(count_over_time({namespace=\"sre-agent\", service=\"sre-agent\"} | json | msg=\"capacity report available\" | post_merge_status=\"healthy\" [24h])) or vector(0)", "queryType": "instant", "refId": "A"}]
        },
        {
          "id": 18, "type": "stat", "title": "Post-change follow-up needed (24h)",
          "description": "Fleet-wide merged actions whose post-change verification found a problem. Any nonzero value needs review; open the linked report for the failed check and evidence.",
          "gridPos": {"h": 4, "w": 6, "x": 12, "y": 28},
          "datasource": {"type": "loki", "uid": "loki"},
          "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "thresholds": {"steps": [{"color": "green", "value": null}, {"color": "red", "value": 1}]}}},
          "targets": [{"expr": "sum(count_over_time({namespace=\"sre-agent\", service=\"sre-agent\"} | json | msg=\"capacity report available\" | post_merge_status=\"needs_attention\" [24h])) or vector(0)", "queryType": "instant", "refId": "A"}]
        },
        {
          "id": 19, "type": "stat", "title": "Actions without completed verification (24h)",
          "description": "Fleet-wide proposals not merged yet, not applicable to post-merge checks, or lacking conclusive evidence. This is a workflow state, not automatically a service health issue.",
          "gridPos": {"h": 4, "w": 6, "x": 18, "y": 28},
          "datasource": {"type": "loki", "uid": "loki"},
          "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "thresholds": {"steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 1}, {"color": "red", "value": 5}]}}},
          "targets": [{"expr": "sum(count_over_time({namespace=\"sre-agent\", service=\"sre-agent\"} | json | msg=\"capacity report available\" | post_merge_status=~\"not_merged|inconclusive|not_applicable\" [24h])) or vector(0)", "queryType": "instant", "refId": "A"}]
        },
        {
          "id": 20, "type": "table", "title": "Capacity decisions and report links",
          "description": "Fleet-wide capacity decisions with merge state and PR links. Each Open scoped report link selects one report; its detail page shows the recorded cluster, namespace, workload, decision, metrics, and verification evidence.",
          "gridPos": {"h": 12, "w": 24, "x": 0, "y": 32},
          "datasource": {"type": "loki", "uid": "loki"},
          "fieldConfig": {"defaults": {}, "overrides": [
            {"matcher": {"id": "byName", "options": "Report ID"}, "properties": [{"id": "links", "value": [{"title": "Open scoped report", "url": "https://reports.localhost:9443/#${__value.text}"}]}]},
            {"matcher": {"id": "byName", "options": "Capacity report"}, "properties": [{"id": "links", "value": [{"title": "Open scoped report", "url": "${__value.text}"}]}]},
            {"matcher": {"id": "byName", "options": "Pull request"}, "properties": [{"id": "links", "value": [{"title": "Open pull request", "url": "${__value.text}"}]}]},
            {"matcher": {"id": "byName", "options": "Post-change status"}, "properties": [{"id": "custom.width", "value": 160}]},
            {"matcher": {"id": "byName", "options": "Capacity report"}, "properties": [{"id": "custom.width", "value": 240}]}
          ]},
          "options": {"sortBy": [{"displayName": "Time", "desc": true}]},
          "transformations": [
            {"id": "extractFields", "options": {"source": "Line", "format": "json"}},
            {"id": "organize", "options": {"excludeByName": {"Line": true, "labels": true, "labelTypes": true, "tsNs": true, "id": true, "msg": true, "level": true, "caller": true, "ts": true, "trace_id": true, "service": true, "version": true, "pod": true, "logger": true, "cluster": true, "job": true, "instance": true, "namespace": true, "container": true, "node": true}, "renameByName": {"report_id": "Report ID", "workload": "Workload", "decision": "Decision", "candidate_floor": "Replica floor", "pr_number": "PR #", "pr_url": "Pull request", "post_merge_status": "Post-change status", "report_url": "Capacity report"}}}
          ],
          "targets": [{"expr": "{namespace=\"sre-agent\", service=\"sre-agent\"} | json | msg=\"capacity report available\"", "refId": "A"}]
        },
        {
          "id": 11,
          "type": "row",
          "title": "Incident remediation history",
          "collapsed": false,
          "gridPos": {"h": 1, "w": 24, "x": 0, "y": 44}
        },
        {
          "id": 12, "type": "table", "title": "Automated incident remediations",
          "description": "Every remediation the SRE agent applied automatically. Each row is one merged PR. Workloads that keep appearing are outliers needing a permanent fix.",
          "gridPos": {"h": 12, "w": 24, "x": 0, "y": 45},
          "datasource": {"type": "loki", "uid": "loki"},
          "fieldConfig": {
            "defaults": {},
            "overrides": [
              {"matcher": {"id": "byName", "options": "Time"}, "properties": [{"id": "custom.width", "value": 180}]},
              {"matcher": {"id": "byName", "options": "workload"}, "properties": [{"id": "custom.width", "value": 220}]},
              {"matcher": {"id": "byName", "options": "remediation_type"}, "properties": [{"id": "custom.width", "value": 90}]},
              {"matcher": {"id": "byName", "options": "pr_status"}, "properties": [{"id": "custom.width", "value": 80}]},
              {"matcher": {"id": "byName", "options": "old_limit"}, "properties": [{"id": "custom.width", "value": 90}]},
              {"matcher": {"id": "byName", "options": "new_limit"}, "properties": [{"id": "custom.width", "value": 90}]},
              {"matcher": {"id": "byName", "options": "peak_mib"}, "properties": [{"id": "unit", "value": "decmbytes"}, {"id": "custom.width", "value": 80}]},
              {"matcher": {"id": "byName", "options": "old_replicas"}, "properties": [{"id": "custom.width", "value": 80}]},
              {"matcher": {"id": "byName", "options": "new_replicas"}, "properties": [{"id": "custom.width", "value": 80}]},
              {"matcher": {"id": "byName", "options": "throttle_pct"}, "properties": [{"id": "unit", "value": "percent"}, {"id": "custom.width", "value": 90}]},
              {"matcher": {"id": "byName", "options": "pr_url"}, "properties": [{"id": "links", "value": [{"title": "Open PR", "url": "${__value.text}"}]}, {"id": "custom.width", "value": 300}]},
              {"matcher": {"id": "byName", "options": "file"}, "properties": [{"id": "custom.width", "value": 260}]}
            ]
          },
          "options": {"sortBy": [{"displayName": "Time", "desc": true}]},
          "transformations": [
            {"id": "extractFields", "options": {"source": "Line", "format": "json"}},
            {"id": "organize", "options": {"excludeByName": {"Line": true, "labels": true, "labelTypes": true, "tsNs": true, "id": true, "msg": true, "level": true, "caller": true, "ts": true, "trace_id": true, "service": true, "version": true, "pod": true, "logger": true, "cluster": true, "job": true, "instance": true, "namespace": true, "container": true, "node": true, "detected_level": true, "level_extracted": true, "pod_extracted": true, "service_extracted": true, "version_extracted": true, "service_name": true}, "renameByName": {"remediation_type": "Type", "workload": "Workload", "pr_status": "Status", "pr_number": "PR #", "pr_url": "PR URL", "file": "File changed", "old_limit": "Old limit", "new_limit": "New limit", "peak_mib": "Peak MiB", "old_replicas": "Old replicas", "new_replicas": "New replicas", "throttle_pct": "Throttle %", "workflow": "Investigation"}}}
          ],
          "targets": [{"expr": "{namespace=\"sre-agent\", service=\"sre-agent\"} | json | msg=\"remediation taken\"", "refId": "A"}]
        },

        {
          "id": 13, "type": "timeseries", "title": "Memory limit vs observed 6h peak",
          "description": "Orange = current memory limit; blue = 6-hour rolling peak. After a limit reduction the limit line moves down; watch whether observed peak remains safely below it.",
          "gridPos": {"h": 10, "w": 24, "x": 0, "y": 57},
          "datasource": {"type": "prometheus", "uid": "mimir"},
          "fieldConfig": {
            "defaults": {"unit": "bytes", "custom": {"lineWidth": 2}},
            "overrides": [
              {"matcher": {"id": "byFrameRefID", "options": "B"}, "properties": [
                {"id": "custom.lineStyle", "value": {"dash": [8, 4], "fill": "dash"}},
                {"id": "custom.lineWidth", "value": 1},
                {"id": "color", "value": {"fixedColor": "orange", "mode": "fixed"}}
              ]}
            ]
          },
          "options": {"tooltip": {"mode": "multi"}, "legend": {"displayMode": "table", "placement": "right", "calcs": ["lastNotNull", "max"]}},
          "targets": [
            {"expr": "max by (cluster, namespace, pod, container) (max_over_time(container_memory_working_set_bytes{cluster=\"$cluster\", namespace=~\"$namespace\", container!=\"\", container!=\"POD\"}[6h]))", "legendFormat": "{{namespace}}/{{pod}}/{{container}} peak 6h", "refId": "A"},
            {"expr": "min by (cluster, namespace, pod, container) (kube_pod_container_resource_limits{cluster=\"$cluster\", namespace=~\"$namespace\", resource=\"memory\", container!=\"\", container!=\"POD\"})", "legendFormat": "{{namespace}}/{{pod}}/{{container}} limit", "refId": "B"}
          ]
        },

        {
          "id": 14, "type": "logs", "title": "Capacity review and remediation events",
          "description": "Structured capacity review outcomes and remediation records, with evidence links in the action table above.",
          "gridPos": {"h": 10, "w": 24, "x": 0, "y": 67},
          "datasource": {"type": "loki", "uid": "loki"},
          "options": {"showTime": true, "wrapLogMessage": true, "enableLogDetails": true, "sortOrder": "Descending", "dedupStrategy": "none"},
          "targets": [{"expr": "{namespace=\"sre-agent\", service=\"sre-agent\"} | json | msg=~\"capacity report available|remediation taken\"", "refId": "A"}]
        }
      ]
    }
