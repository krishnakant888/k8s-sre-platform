apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-logs-explorer
  namespace: observability
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: Platform
data:
  logs-explorer.json: |
    {
      "uid": "logs-explorer",
      "title": "Logs explorer",
      "tags": ["loki", "platform"],
      "schemaVersion": 39,
      "version": 1,
      "refresh": "10s",
      "time": {"from": "now-30m", "to": "now"},
      "templating": {"list": [
        {"name": "namespace", "type": "query", "datasource": {"type": "loki", "uid": "loki"},
         "query": "label_values(namespace)", "includeAll": true, "multi": true,
         "current": {"text": "All", "value": "$__all"}, "refresh": 2},
        {"name": "service", "type": "query", "datasource": {"type": "loki", "uid": "loki"},
         "query": "label_values({namespace=~\"$namespace\"}, service)", "includeAll": true, "multi": true,
         "current": {"text": "All", "value": "$__all"}, "refresh": 2},
        {"name": "search", "type": "textbox", "label": "contains", "query": ""}
      ]},
      "panels": [
        {"id": 1, "type": "timeseries", "title": "Log volume by level", "gridPos": {"h": 7, "w": 24, "x": 0, "y": 0},
         "datasource": {"type": "loki", "uid": "loki"},
         "fieldConfig": {"defaults": {"custom": {"drawStyle": "bars", "stacking": {"mode": "normal"}}}},
         "targets": [{"expr": "sum by (level) (count_over_time({namespace=~\"$namespace\", service=~\"$service\"} |= \"$search\" | json | __error__=\"\" [1m]))", "legendFormat": "{{level}}", "refId": "A"}]},
        {"id": 2, "type": "logs", "title": "Logs", "gridPos": {"h": 22, "w": 24, "x": 0, "y": 7},
         "datasource": {"type": "loki", "uid": "loki"},
         "options": {"showTime": true, "wrapLogMessage": true, "enableLogDetails": true, "prettifyLogMessage": true, "sortOrder": "Descending"},
         "targets": [{"expr": "{namespace=~\"$namespace\", service=~\"$service\"} |= \"$search\"", "refId": "A"}]}
      ]
    }
