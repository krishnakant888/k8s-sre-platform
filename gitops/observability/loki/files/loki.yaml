# single binary, filesystem on the pod PVC, one replica
auth_enabled: false
analytics:
  reporting_enabled: false
server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_format: json
common:
  instance_addr: 127.0.0.1
  path_prefix: /data
  replication_factor: 1
  ring:
    kvstore: {store: inmemory}
  storage:
    filesystem:
      chunks_directory: /data/chunks
      rules_directory: /data/rules
schema_config:
  configs:
    - from: "2024-04-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h
storage_config:
  tsdb_shipper:
    active_index_directory: /data/tsdb-index
    cache_location: /data/tsdb-cache
ingester:
  wal:
    dir: /data/wal
compactor:
  working_directory: /data/retention
  retention_enabled: true
  delete_request_store: filesystem
limits_config:
  retention_period: 168h
  allow_structured_metadata: true
  volume_enabled: true
  max_query_series: 20000                  # 5000
  # 4x Loki's defaults (shown after each): three clusters tail every container, plus Kubernetes events
  ingestion_rate_mb: 16                    # 4
  ingestion_burst_size_mb: 24              # 6
  per_stream_rate_limit: 12MB              # 3MB
  per_stream_rate_limit_burst: 60MB        # 15MB
  max_global_streams_per_user: 20000       # 5000
  max_entries_limit_per_query: 20000       # 5000
