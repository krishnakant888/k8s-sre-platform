# monolithic mode: one process runs ingester, querier, ruler, alertmanager and the rest.
# Blocks are kept on the pod's PVC (filesystem backend), single replica.
multitenancy_enabled: false
usage_stats:
  enabled: false
activity_tracker:
  filepath: /data/activity.log
server:
  http_listen_port: 8080
  grpc_listen_port: 9095
  log_format: json
blocks_storage:
  backend: filesystem
  filesystem:
    dir: /data/blocks
  tsdb:
    dir: /data/tsdb
  bucket_store:
    sync_dir: /data/tsdb-sync
compactor:
  data_dir: /data/compactor
  sharding_ring:
    kvstore: {store: inmemory}
distributor:
  ring:
    kvstore: {store: inmemory}
ingester:
  ring:
    replication_factor: 1
    kvstore: {store: inmemory}
store_gateway:
  sharding_ring:
    replication_factor: 1
    kvstore: {store: inmemory}
ruler_storage:
  backend: local
  local:
    directory: /rules
ruler:
  rule_path: /data/ruler
  alertmanager_url: http://localhost:8080/alertmanager
  evaluation_interval: 30s
alertmanager:
  data_dir: /data/am-state
  external_url: http://alerts.localhost:8080/alertmanager
  # routing lives in Git: tenants without their own config use this file
  fallback_config_file: /etc/mimir-am/anonymous.yaml
  persist_interval: 5m
  sharding_ring:
    replication_factor: 1
    kvstore: {store: inmemory}
# the local backend cannot persist notification state, which kills notifications ~15 minutes after start
alertmanager_storage:
  backend: filesystem
  filesystem:
    dir: /data/am-store
limits:
  compactor_blocks_retention_period: 168h
  ruler_max_rules_per_rule_group: 50
