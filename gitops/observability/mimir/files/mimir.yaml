# monolithic mode: one process runs ingester, querier, ruler and the rest.
# Blocks are kept on the pod's PVC (filesystem backend), single replica.
# Alerting is done by Grafana (see gitops/observability/alerting), the ruler here only evaluates recording rules.
multitenancy_enabled: false
usage_stats:
  enabled: false
activity_tracker:
  filepath: /data/activity.log
server:
  http_listen_port: 8080
  grpc_listen_port: 9095
  log_format: json
blocks_storage:
  backend: filesystem
  filesystem:
    dir: /data/blocks
  tsdb:
    dir: /data/tsdb
  bucket_store:
    sync_dir: /data/tsdb-sync
compactor:
  data_dir: /data/compactor
  sharding_ring:
    kvstore: {store: inmemory}
distributor:
  ring:
    kvstore: {store: inmemory}
ingester:
  ring:
    replication_factor: 1
    kvstore: {store: inmemory}
store_gateway:
  sharding_ring:
    replication_factor: 1
    kvstore: {store: inmemory}
ruler_storage:
  backend: local
  local:
    directory: /rules
ruler:
  rule_path: /data/ruler
  evaluation_interval: 30s
limits:
  # Per-tenant limits at 4x Mimir's defaults (shown after each). Three clusters push to one tenant, and every pod restart
  # leaves its old series in the head for about two hours, so the defaults were hit within minutes of a Docker restart.
  max_global_series_per_user: 600000       # 150000
  max_global_series_per_metric: 80000      # 20000
  ingestion_rate: 40000                    # samples/s, 10000
  ingestion_burst_size: 800000             # 200000
  compactor_blocks_retention_period: 168h
  ruler_max_rules_per_rule_group: 50
