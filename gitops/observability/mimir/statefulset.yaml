apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mimir
  namespace: observability
  labels: {app.kubernetes.io/name: mimir}
spec:
  serviceName: mimir
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: mimir}
  template:
    metadata:
      labels: {app.kubernetes.io/name: mimir}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: mimir
          image: grafana/mimir:2.16.0
          args:
            - -config.file=/etc/mimir/mimir.yaml
            - -target=all,alertmanager,ruler
          ports:
            - {name: http, containerPort: 8080}
            - {name: grpc, containerPort: 9095}
          readinessProbe:
            httpGet: {path: /ready, port: http}
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /ready, port: http}
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests: {cpu: 200m, memory: 512Mi}
            limits: {memory: 1536Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: config, mountPath: /etc/mimir}
            - {name: rules, mountPath: /rules/anonymous}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          configMap: {name: mimir-config}
        - name: rules
          configMap: {name: mimir-rules}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 10Gi
