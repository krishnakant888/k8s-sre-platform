apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: observability
resources:
  - statefulset.yaml
  - service.yaml
# generated config maps get a content hash in their name, so a config or rule change rolls the pod
configMapGenerator:
  - name: mimir-config
    files: [files/mimir.yaml]
  - name: mimir-rules
    files:
      - files/platform.yaml
      - files/orders-api-slo.yaml
  - name: mimir-alertmanager
    files: [files/anonymous.yaml]
