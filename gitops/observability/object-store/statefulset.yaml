apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: object-store
  namespace: observability
  labels: {app.kubernetes.io/name: object-store}
spec:
  serviceName: object-store
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: object-store}
  template:
    metadata:
      labels: {app.kubernetes.io/name: object-store}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:3.80
          args:
            - server
            - -dir=/data
            - -ip.bind=0.0.0.0
            - -master.volumeSizeLimitMB=128
            - -volume.max=60
            - -filer
            - -s3
            - -s3.config=/etc/s3/s3.json
          ports:
            - {name: s3, containerPort: 8333}
            - {name: master, containerPort: 9333}
          readinessProbe:
            httpGet: {path: /cluster/status, port: master}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /cluster/status, port: master}
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 768Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: s3-config, mountPath: /etc/s3, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: s3-config
          secret:
            secretName: object-store-credentials
            items:
              - {key: s3.json, path: s3.json}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 10Gi
