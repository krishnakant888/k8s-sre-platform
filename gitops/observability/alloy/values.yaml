# One collector for everything in the production cluster: scrapes metrics, tails pod logs, takes otlp traces.
# The stores (Mimir, Loki, Tempo) run in the separate monitoring cluster, so everything is shipped there through the
# NodePorts of gitops/monitoring/exposure. kind nodes share a Docker network, which resolves container names.
# Runs as a single deployment, logs come through the kubernetes API so no hostPath is needed.
crds:
  create: false   # PodLogs CRD is not used, and the observability project may not create CRDs

controller:
  type: deployment
  replicas: 1
  volumes:
    extra:
      - name: tmp
        emptyDir: {}
  podLabels:
    platform.io/api-access: "true"

alloy:
  stabilityLevel: generally-available
  mounts:
    extra:
      - name: tmp
        mountPath: /tmp
  extraPorts:
    - {name: otlp-grpc, port: 4317, targetPort: 4317, protocol: TCP}
    - {name: otlp-http, port: 4318, targetPort: 4318, protocol: TCP}
  resources:
    requests: {cpu: 200m, memory: 384Mi}
    limits: {memory: 768Mi}
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 473
    capabilities:
      drop: [ALL]
    seccompProfile:
      type: RuntimeDefault
  configMap:
    create: true
    content: |
      logging {
        level  = "info"
        format = "json"
      }

      // ---------- metrics ----------
      prometheus.remote_write "mimir" {
        endpoint {
          url = "http://monitoring-control-plane:30900/api/v1/push"
        }
        external_labels = {cluster = "platform"}
      }

      // pods that opt in with prometheus.io/scrape: "true" (+ port, path)
      discovery.kubernetes "pods" {
        role = "pod"
      }

      discovery.relabel "annotated_pods" {
        targets = discovery.kubernetes.pods.targets
        rule {
          source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_scrape"]
          regex         = "true"
          action        = "keep"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_path"]
          regex         = "(.+)"
          target_label  = "__metrics_path__"
        }
        rule {
          source_labels = ["__address__", "__meta_kubernetes_pod_annotation_prometheus_io_port"]
          regex         = "([^:]+)(?::\\d+)?;(\\d+)"
          replacement   = "$1:$2"
          target_label  = "__address__"
        }
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          target_label  = "service"
        }
      }

      prometheus.scrape "annotated_pods" {
        scrape_interval = "30s"
        targets    = discovery.relabel.annotated_pods.output
        forward_to = [prometheus.remote_write.mimir.receiver]
      }

      prometheus.scrape "platform" {
        scrape_interval = "30s"
        targets = [
          {"__address__" = "kube-state-metrics:8080", "job" = "kube-state-metrics"},
          {"__address__" = "alloy:12345", "job" = "alloy"},
        ]
        forward_to = [prometheus.remote_write.mimir.receiver]
      }

      // container cpu/memory straight from the kubelet (needs nodes/metrics only, not nodes/proxy)
      discovery.kubernetes "nodes" {
        role = "node"
      }

      discovery.relabel "cadvisor" {
        targets = discovery.kubernetes.nodes.targets
        rule {
          target_label = "__metrics_path__"
          replacement  = "/metrics/cadvisor"
        }
      }

      prometheus.scrape "cadvisor" {
        scrape_interval = "30s"
        targets           = discovery.relabel.cadvisor.output
        scheme            = "https"
        bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
        tls_config {
          insecure_skip_verify = true   // kubeadm kubelet serving cert is self-signed
        }
        job_name   = "cadvisor"
        forward_to = [prometheus.remote_write.mimir.receiver]
      }

      // ---------- logs ----------
      loki.write "loki" {
        endpoint {
          url = "http://monitoring-control-plane:30310/loki/api/v1/push"
        }
      }

      discovery.relabel "pod_logs" {
        targets = discovery.kubernetes.pods.targets
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name", "__meta_kubernetes_pod_label_app"]
          separator     = ";"
          regex         = "([^;]+);.*|;([^;]+)"
          replacement   = "$1$2"
          target_label  = "service"
        }
      }

      loki.source.kubernetes "pods" {
        targets    = discovery.relabel.pod_logs.output
        forward_to = [loki.write.loki.receiver]
      }

      // ---------- traces ----------
      otelcol.receiver.otlp "default" {
        grpc {
          endpoint = "0.0.0.0:4317"
        }
        http {
          endpoint = "0.0.0.0:4318"
        }
        output {
          traces = [otelcol.processor.batch.default.input]
        }
      }

      otelcol.processor.batch "default" {
        output {
          traces = [otelcol.exporter.otlp.tempo.input]
        }
      }

      otelcol.exporter.otlp "tempo" {
        client {
          endpoint = "monitoring-control-plane:30417"
          tls {
            insecure = true
          }
        }
      }

serviceMonitor:
  enabled: false

# the sidecar that reloads the config, the chart default is far larger than it uses
configReloader:
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {memory: 64Mi}
