# Settings shared by the collectors of all clusters. The configuration itself is config.alloy (ConfigMap alloy-config,
# deployed by the alloy-config Application) and the per-cluster endpoints are in values-<cluster>.yaml.
crds:
  create: false   # PodLogs CRD is not used, and the projects may not create CRDs

controller:
  type: deployment
  replicas: 1
  volumes:
    extra:
      - name: tmp
        emptyDir: {}
  podLabels:
    platform.io/api-access: "true"

alloy:
  stabilityLevel: generally-available
  mounts:
    extra:
      - name: tmp
        mountPath: /tmp
  extraPorts:
    - {name: otlp-grpc, port: 4317, targetPort: 4317, protocol: TCP}
    - {name: otlp-http, port: 4318, targetPort: 4318, protocol: TCP}
  configMap:
    create: false
    name: alloy-config
    key: config.alloy
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 473
    capabilities:
      drop: [ALL]
    seccompProfile:
      type: RuntimeDefault

serviceMonitor:
  enabled: false

# the sidecar that reloads the config, the chart default is far larger than it uses
configReloader:
  resources:
    requests: {cpu: 10m, memory: 64Mi}
    limits: {memory: 128Mi}
