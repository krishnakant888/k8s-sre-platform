replicas: 1

podLabels:
  platform.io/api-access: "true"

resources:
  requests: {cpu: 25m, memory: 64Mi}
  limits: {memory: 256Mi}

securityContext:
  enabled: true
  runAsNonRoot: true
  runAsUser: 65534
  fsGroup: 65534

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

prometheus:
  monitor:
    enabled: false
