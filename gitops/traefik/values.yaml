# upstream Kubernetes ships no ingress controller (k3s bundled traefik), so it is installed here.
# kind maps host :8080/:8443 to these NodePorts, see bootstrap/kind-config.yaml.
service:
  type: NodePort
ports:
  web:
    nodePort: 30080
  websecure:
    nodePort: 30443
providers:
  kubernetesIngress:
    publishedService:
      enabled: false
resources:
  requests: {cpu: 50m, memory: 64Mi}
  limits: {memory: 128Mi}
