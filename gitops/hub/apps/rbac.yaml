apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hub-rbac
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: hub
  source:
    repoURL: https://github.com/krishnakant888/k8s-sre-platform.git
    targetRevision: test/gateway-e2e
    path: gitops/hub/rbac
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
