# The Argo CD cluster deploys itself (argocd) and its ingress controller here; everything else it deploys is in the
# projects of the platform and monitoring clusters.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: hub
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  description: The gitops cluster itself (Argo CD, ingress-nginx)
  sourceRepos:
    - https://github.com/krishnakant888/k8s-sre-platform.git
    - https://argoproj.github.io/argo-helm
    - https://kubernetes.github.io/ingress-nginx
  destinations:
    - server: https://kubernetes.default.svc
      namespace: "*"
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
