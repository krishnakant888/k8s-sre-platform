# The Argo CD cluster deploys itself (argocd) and its gateway (Traefik) here; everything else it deploys is in the
# projects of the platform and observability clusters.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: hub
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  description: The gitops cluster itself (Argo CD, its gateway, the collector)
  sourceRepos:
    - https://github.com/krishnakant888/k8s-sre-platform.git
    - https://argoproj.github.io/argo-helm
    - https://traefik.github.io/charts
    - https://charts.jetstack.io
    - https://github.com/kubernetes-sigs/gateway-api.git
    - https://grafana.github.io/helm-charts
    - https://prometheus-community.github.io/helm-charts
  destinations:
    - server: https://kubernetes.default.svc
      namespace: "*"
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
