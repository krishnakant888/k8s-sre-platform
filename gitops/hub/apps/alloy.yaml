apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hub-alloy
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: hub
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: alloy
      targetRevision: 1.14.2
      helm:
        releaseName: alloy
        valueFiles:
          - $values/gitops/observability/alloy/values.yaml
          - $values/gitops/observability/alloy/values-gitops.yaml
    - repoURL: https://github.com/krishnakant888/k8s-sre-platform.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
