# Issues the TLS certificate of the Gateway. The chart's startupapicheck hook Job is turned off in the values,
# so the chart has no Helm hooks.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitops-cert-manager
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: hub
  sources:
    - repoURL: https://charts.jetstack.io
      chart: cert-manager
      targetRevision: v1.21.3
      helm:
        releaseName: cert-manager
        valueFiles:
          - $values/gitops/cert-manager/values.yaml
    - repoURL: https://github.com/krishnakant888/k8s-sre-platform.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:   # the CRDs it needs may still be arriving
      limit: 5
      backoff: {duration: 30s, factor: 2, maxDuration: 5m}
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
