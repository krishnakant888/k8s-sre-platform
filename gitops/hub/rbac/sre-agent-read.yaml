# What the SRE agent may read in the gitops cluster with the token of the service account bootstrap.py creates there
# (sre-agent-reader in argocd): the Argo CD applications (a Role from bootstrap) and, to investigate Argo CD itself,
# pods, events and workloads of every namespace. Read-only.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sre-agent-hub-read
rules:
  - apiGroups: [""]
    resources: [pods, events, nodes]
    verbs: [get, list]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets, replicasets]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sre-agent-hub-read
subjects:
  - {kind: ServiceAccount, name: sre-agent-reader, namespace: argocd}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: sre-agent-hub-read
