# Argo CD of the monitoring cluster. It is separate from the production one on purpose:
# monitoring keeps deploying and healing itself while the production cluster is down or being rebuilt.
global:
  domain: argocd-monitoring.localhost   # not argocd.localhost: browsers share cookies between ports of one host

configs:
  params:
    server.insecure: true   # TLS ends at the ingress controller
  cm:
    admin.enabled: true
    exec.enabled: false

  rbac:
    policy.default: role:readonly
    scopes: "[groups]"

dex:
  enabled: false

notifications:
  enabled: false

server:
  ingress:
    enabled: true
    ingressClassName: nginx
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 256Mi}

controller:
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {memory: 1Gi}

repoServer:
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 512Mi}

redis:
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {memory: 128Mi}

applicationSet:
  enabled: false
