# Collector of the monitoring cluster: it watches the monitoring stack itself and writes to the local Mimir and Loki.
# Without it nothing would alert when Mimir, Loki, Tempo or Grafana fail. The production cluster has its own collector
# (gitops/observability/alloy) that ships to this cluster.
crds:
  create: false

controller:
  type: deployment
  replicas: 1
  volumes:
    extra:
      - name: tmp
        emptyDir: {}
  podLabels:
    platform.io/api-access: "true"

alloy:
  stabilityLevel: generally-available
  mounts:
    extra:
      - name: tmp
        mountPath: /tmp
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 512Mi}
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 473
    capabilities:
      drop: [ALL]
    seccompProfile:
      type: RuntimeDefault
  configMap:
    create: true
    content: |
      logging {
        level  = "info"
        format = "json"
      }

      // ---------- metrics ----------
      prometheus.remote_write "mimir" {
        endpoint {
          url = "http://mimir:8080/api/v1/push"
        }
        external_labels = {cluster = "monitoring"}
      }

      discovery.kubernetes "pods" {
        role = "pod"
      }

      discovery.relabel "annotated_pods" {
        targets = discovery.kubernetes.pods.targets
        rule {
          source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_scrape"]
          regex         = "true"
          action        = "keep"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_path"]
          regex         = "(.+)"
          target_label  = "__metrics_path__"
        }
        rule {
          source_labels = ["__address__", "__meta_kubernetes_pod_annotation_prometheus_io_port"]
          regex         = "([^:]+)(?::\\d+)?;(\\d+)"
          replacement   = "$1:$2"
          target_label  = "__address__"
        }
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          target_label  = "service"
        }
      }

      prometheus.scrape "annotated_pods" {
        scrape_interval = "30s"
        targets    = discovery.relabel.annotated_pods.output
        forward_to = [prometheus.remote_write.mimir.receiver]
      }

      prometheus.scrape "platform" {
        scrape_interval = "30s"
        targets = [
          {"__address__" = "kube-state-metrics:8080", "job" = "kube-state-metrics"},
          {"__address__" = "mimir:8080", "job" = "mimir"},
          {"__address__" = "alloy:12345", "job" = "alloy"},
        ]
        forward_to = [prometheus.remote_write.mimir.receiver]
      }

      // container cpu/memory straight from the kubelet
      discovery.kubernetes "nodes" {
        role = "node"
      }

      discovery.relabel "cadvisor" {
        targets = discovery.kubernetes.nodes.targets
        rule {
          target_label = "__metrics_path__"
          replacement  = "/metrics/cadvisor"
        }
      }

      prometheus.scrape "cadvisor" {
        scrape_interval = "30s"
        targets           = discovery.relabel.cadvisor.output
        scheme            = "https"
        bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
        tls_config {
          insecure_skip_verify = true   // kubeadm kubelet serving cert is self-signed
        }
        job_name   = "cadvisor"
        forward_to = [prometheus.remote_write.mimir.receiver]
      }

      // ---------- logs ----------
      loki.write "loki" {
        endpoint {
          url = "http://loki:3100/loki/api/v1/push"
        }
      }

      discovery.relabel "pod_logs" {
        targets = discovery.kubernetes.pods.targets
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name", "__meta_kubernetes_pod_label_app"]
          separator     = ";"
          regex         = "([^;]+);.*|;([^;]+)"
          replacement   = "$1$2"
          target_label  = "service"
        }
      }

      loki.source.kubernetes "pods" {
        targets    = discovery.relabel.pod_logs.output
        forward_to = [loki.write.loki.receiver]
      }

serviceMonitor:
  enabled: false

configReloader:
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {memory: 64Mi}
