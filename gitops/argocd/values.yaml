global:
  domain: argocd.localhost

configs:
  params:
    server.insecure: true   # TLS ends at the ingress controller
  cm:
    admin.enabled: true
    exec.enabled: false

  rbac:
    policy.default: role:readonly
    scopes: "[groups]"

dex:
  enabled: false

notifications:
  enabled: false

server:
  ingress:
    enabled: true
    ingressClassName: nginx
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 512Mi}

controller:
  resources:
    requests: {cpu: 500m, memory: 1Gi}
    limits: {memory: 2Gi}

repoServer:
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 1Gi}

redis:
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 256Mi}

applicationSet:
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 256Mi}
