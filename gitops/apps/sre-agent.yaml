apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sre-agent
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "6"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: workloads
  source:
    repoURL: https://github.com/krishnakant888/k8s-sre-platform.git
    targetRevision: main
    path: gitops/workloads/sre-agent
  destination:
    server: https://kubernetes.default.svc
    namespace: sre-agent
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # the WorkflowTemplate needs the CRD from the argo-workflows app, which takes a few minutes on a fresh cluster:
    # keep retrying with a growing delay instead of giving up after 5 attempts
    retry:
      limit: 15
      backoff: {duration: 30s, factor: 2, maxDuration: 5m}
    syncOptions:
      - SkipDryRunOnMissingResource=true   # WorkflowTemplate: its CRD comes from the argo-workflows app (wave 0)
