apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prod-platform-rbac
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: prod-platform
  source:
    repoURL: https://github.com/krishnakant888/k8s-sre-platform.git
    targetRevision: main
    path: gitops/platform/rbac
  destination:
    name: platform   # registered in this Argo CD by bootstrap.py
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
