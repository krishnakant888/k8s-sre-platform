apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prod-kube-state-metrics
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: prod-observability
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-state-metrics
      targetRevision: 8.6.0
      helm:
        releaseName: kube-state-metrics
        valueFiles:
          - $values/gitops/observability/kube-state-metrics/values.yaml
    - repoURL: https://github.com/krishnakant888/k8s-sre-platform.git
      targetRevision: main
      ref: values
  destination:
    name: platform   # registered in this Argo CD by bootstrap.py
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
