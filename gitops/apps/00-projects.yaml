# AppProjects for the apps that run in the platform cluster. They are created in the observability cluster, where the
# single Argo CD runs, and every destination is the registered cluster named "platform".
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: prod-platform
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  description: Platform cluster add-ons and operators (sealed-secrets, kyverno, gateway with traefik and cert-manager)
  sourceRepos:
    - https://github.com/krishnakant888/k8s-sre-platform.git
    - https://argoproj.github.io/argo-helm
    - https://bitnami.github.io/sealed-secrets
    - https://kyverno.github.io/kyverno
    - https://traefik.github.io/charts
    - https://charts.jetstack.io
    - https://github.com/kubernetes-sigs/gateway-api.git
  destinations:
    - name: platform
      namespace: "*"
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: prod-observability
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  description: Alloy and kube-state-metrics in the platform cluster. The LGTM stack and Grafana run in the observability cluster.
  sourceRepos:
    - https://github.com/krishnakant888/k8s-sre-platform.git
    - https://grafana.github.io/helm-charts
    - https://prometheus-community.github.io/helm-charts
  destinations:
    - name: platform
      namespace: observability
  clusterResourceWhitelist:
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: prod-workloads
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  description: Sample api, frontend and the sre agent in the platform cluster
  sourceRepos:
    - https://github.com/krishnakant888/k8s-sre-platform.git
  destinations:
    - name: platform
      namespace: demo
    - name: platform
      namespace: sre-agent
    - name: platform
      namespace: sandbox
    - name: platform
      namespace: scenarios   # failure drills asked for in the portal (gitops/fault-drills/active)
    - name: platform
      namespace: "sbx-*"      # sandboxes asked for in the portal (gitops/platform/base/sandbox-*.yaml)
  clusterResourceWhitelist: []
