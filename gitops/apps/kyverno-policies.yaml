apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prod-kyverno-policies
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: prod-platform
  source:
    repoURL: https://github.com/krishnakant888/k8s-sre-platform.git
    targetRevision: main
    path: gitops/platform/policies
  destination:
    name: platform   # registered in this Argo CD by bootstrap.py
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - SkipDryRunOnMissingResource=true
