apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-vpa
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://charts.fairwinds.com/stable
    chart: vpa
    targetRevision: 5.2.0
    helm:
      values: |
        admissionController:
          enabled: true
        updater:
          enabled: true
        recommender:
          enabled: true
  destination:
    name: platform
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
