# The cluster issuer for the Gateway certificate and the HTTPRoutes of this cluster (gitops/gateway/platform).
# Needs cert-manager and its CRDs from the earlier wave.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prod-gateway
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: prod-platform
  source:
    repoURL: https://github.com/krishnakant888/k8s-sre-platform.git
    targetRevision: main
    path: gitops/gateway/platform
  destination:
    name: platform   # registered in this Argo CD by bootstrap.py
    namespace: traefik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:   # the CRDs it needs may still be arriving
      limit: 5
      backoff: {duration: 30s, factor: 2, maxDuration: 5m}
    syncOptions:
      - SkipDryRunOnMissingResource=true
