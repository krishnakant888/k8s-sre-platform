apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: observability
  source:
    repoURL: https://github.com/krishnakant888/k3s-sre-platform.git
    targetRevision: main
    path: gitops/observability/secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
