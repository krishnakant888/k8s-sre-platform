apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prod-sealed-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
spec:
  project: prod-platform
  sources:
    - repoURL: https://bitnami.github.io/sealed-secrets
      chart: sealed-secrets
      targetRevision: 2.16.2
      helm:
        releaseName: sealed-secrets
        valueFiles:
          - $values/gitops/sealed-secrets/values.yaml
    - repoURL: https://github.com/krishnakant888/k8s-sre-platform.git
      targetRevision: main
      ref: values
  destination:
    name: platform   # registered in this Argo CD by bootstrap.py
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
