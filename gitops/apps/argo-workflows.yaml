apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prod-argo-workflows
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: prod-platform
  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argo-workflows
      targetRevision: 2.0.14
      helm:
        releaseName: argo-workflows
        valueFiles:
          - $values/gitops/argo-workflows/values.yaml
    - repoURL: https://github.com/krishnakant888/k8s-sre-platform.git
      targetRevision: main
      ref: values
  destination:
    name: platform   # registered in this Argo CD by bootstrap.py
    namespace: argo-workflows
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
