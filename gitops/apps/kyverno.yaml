apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prod-kyverno
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  project: prod-platform
  sources:
    - repoURL: https://kyverno.github.io/kyverno
      chart: kyverno
      targetRevision: 3.2.7
      helm:
        releaseName: kyverno
        valueFiles:
          - $values/gitops/kyverno/values.yaml
    - repoURL: https://github.com/krishnakant888/k8s-sre-platform.git
      targetRevision: main
      ref: values
  destination:
    name: platform   # registered in this Argo CD by bootstrap.py
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
