# single replicas, this is a laptop
admissionController:
  replicas: 1
  container:
    resources:
      requests: {cpu: 50m, memory: 128Mi}
      limits: {memory: 384Mi}
backgroundController:
  replicas: 1
  resources:
    requests: {cpu: 25m, memory: 64Mi}
    limits: {memory: 256Mi}
cleanupController:
  replicas: 1
  resources:
    requests: {cpu: 25m, memory: 64Mi}
    limits: {memory: 128Mi}
reportsController:
  replicas: 1
  resources:
    requests: {cpu: 25m, memory: 64Mi}
    limits: {memory: 256Mi}
features:
  policyExceptions:
    enabled: false


# bitnami/kubectl was removed from docker hub, use the upstream image for the cleanup jobs.
# The two helm hook jobs call /bin/bash, which this distroless image does not have, so they stay off.
webhooksCleanup:
  enabled: false
policyReportsCleanup:
  enabled: false
cleanupJobs:
  admissionReports:
    image: &kubectl
      registry: registry.k8s.io
      repository: kubectl
      tag: v1.31.5
  clusterAdmissionReports:
    image: *kubectl
  ephemeralReports:
    image: *kubectl
  clusterEphemeralReports:
    image: *kubectl
