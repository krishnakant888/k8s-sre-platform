# single replicas, this is a laptop
admissionController:
  replicas: 1
  container:
    resources:
      requests: {cpu: 50m, memory: 128Mi}
      limits: {memory: 384Mi}
backgroundController:
  replicas: 1
  resources:
    requests: {cpu: 25m, memory: 64Mi}
    limits: {memory: 256Mi}
cleanupController:
  replicas: 1
  resources:
    requests: {cpu: 25m, memory: 64Mi}
    limits: {memory: 128Mi}
reportsController:
  replicas: 1
  resources:
    requests: {cpu: 25m, memory: 64Mi}
    limits: {memory: 256Mi}
features:
  policyExceptions:
    enabled: false


# bitnami/kubectl was removed from docker hub, use the upstream image for the cleanup jobs.
# The two helm hook jobs call /bin/bash, which this distroless image does not have, so they stay off.
# The image user is non-numeric, runAsNonRoot needs an explicit uid.
webhooksCleanup:
  enabled: false
policyReportsCleanup:
  enabled: false
cleanupJobs:
  admissionReports:
    image: &kubectl
      registry: registry.k8s.io
      repository: kubectl
      tag: v1.31.5
    securityContext: &nonroot
      runAsUser: 65532
      runAsNonRoot: true
      privileged: false
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: [ALL]
      seccompProfile:
        type: RuntimeDefault
  clusterAdmissionReports:
    image: *kubectl
    securityContext: *nonroot
  ephemeralReports:
    image: *kubectl
    securityContext: *nonroot
  clusterEphemeralReports:
    image: *kubectl
    securityContext: *nonroot
