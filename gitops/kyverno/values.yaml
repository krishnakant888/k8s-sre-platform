# single replicas, this is a laptop
admissionController:
  replicas: 1
  container:
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {memory: 768Mi}
backgroundController:
  replicas: 1
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 512Mi}
cleanupController:
  replicas: 1
  resources:
    requests: {cpu: 25m, memory: 64Mi}
    limits: {memory: 256Mi}
reportsController:
  replicas: 1
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 512Mi}
features:
  policyExceptions:
    enabled: false


# The report cleanup cronjobs and helm hook jobs shell out to /bin/bash in bitnami/kubectl,
# which no longer exists on docker hub, and the upstream kubectl image has no bash.
# They only matter past 10k reports, so they stay off locally.
webhooksCleanup:
  enabled: false
policyReportsCleanup:
  enabled: false
cleanupJobs:
  admissionReports:
    enabled: false
  clusterAdmissionReports:
    enabled: false
  ephemeralReports:
    enabled: false
  clusterEphemeralReports:
    enabled: false
