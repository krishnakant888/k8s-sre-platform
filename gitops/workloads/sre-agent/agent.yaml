# The investigation steps run as Argo Workflow pods under this service account (see workflow-template.yaml).
# The agent runs in the observability cluster, next to Loki, Mimir and Tempo. It reads the platform cluster (pods, events) and
# the Argo CD Applications of the gitops cluster with read-only tokens in the Secrets platform-reader and gitops-reader,
# which bootstrap.py creates from service accounts in those clusters.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sre-agent
  namespace: sre-agent
automountServiceAccountToken: true   # needed: the Argo executor reports step results through the API
---
# the webhook can start investigations and nothing else
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alert-webhook
  namespace: sre-agent
automountServiceAccountToken: true   # needed: creates Workflow objects through the API
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: alert-webhook-workflows
  namespace: sre-agent
rules:
  - apiGroups: [argoproj.io]
    resources: [workflows]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: alert-webhook-workflows
  namespace: sre-agent
subjects:
  - {kind: ServiceAccount, name: alert-webhook, namespace: sre-agent}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: alert-webhook-workflows
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-webhook
  namespace: sre-agent
  labels: {app.kubernetes.io/name: alert-webhook, app.kubernetes.io/version: "1.0.0", team: platform}
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: alert-webhook}
  template:
    metadata:
      labels: {app.kubernetes.io/name: alert-webhook, app.kubernetes.io/version: "1.0.0", team: platform}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: alert-webhook
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app.kubernetes.io/name: alert-webhook}
      containers:
        - name: webhook
          image: ghcr.io/krishnakant888/sre-agent:sha-bb78e01e5046fb81259e78b76d9ea7707ba03cf6
          command: [uvicorn, "agent.webhook:app", "--host", "0.0.0.0", "--port", "8080", "--no-access-log"]
          ports:
            - {name: http, containerPort: 8080}
          env:
            - {name: WORKFLOW_NAMESPACE, value: sre-agent}
            - {name: WORKFLOW_TEMPLATE, value: incident-investigation}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 15
          resources:
            requests: {cpu: 50m, memory: 256Mi}
            limits: {memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: alert-webhook
  namespace: sre-agent
spec:
  selector: {app.kubernetes.io/name: alert-webhook}
  ports:
    - {name: http, port: 8080, targetPort: http}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: alert-webhook
  namespace: sre-agent
spec:
  minAvailable: 1
  selector:
    matchLabels: {app.kubernetes.io/name: alert-webhook}
