# The investigation steps run as Argo Workflow pods under this service account (see workflow-template.yaml).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sre-agent
  namespace: sre-agent
automountServiceAccountToken: true   # needed: reads the cluster API and stores reports as configmaps
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sre-agent-reports
  namespace: sre-agent
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [create, get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sre-agent-reports
  namespace: sre-agent
subjects:
  - {kind: ServiceAccount, name: sre-agent, namespace: sre-agent}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sre-agent-reports
---
# the webhook can start investigations and nothing else
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alert-webhook
  namespace: sre-agent
automountServiceAccountToken: true   # needed: creates Workflow objects through the API
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: alert-webhook-workflows
  namespace: sre-agent
rules:
  - apiGroups: [argoproj.io]
    resources: [workflows]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: alert-webhook-workflows
  namespace: sre-agent
subjects:
  - {kind: ServiceAccount, name: alert-webhook, namespace: sre-agent}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: alert-webhook-workflows
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-webhook
  namespace: sre-agent
  labels: {app.kubernetes.io/name: alert-webhook}
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: alert-webhook}
  template:
    metadata:
      labels: {app.kubernetes.io/name: alert-webhook}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: alert-webhook
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app.kubernetes.io/name: alert-webhook}
      containers:
        - name: webhook
          image: ghcr.io/krishnakant888/sre-agent:sha-ca1513fb60ecbc12dd72c44ca460d2948509d161
          command: [uvicorn, "agent.webhook:app", "--host", "0.0.0.0", "--port", "8080", "--no-access-log"]
          ports:
            - {name: http, containerPort: 8080}
          env:
            - {name: WORKFLOW_NAMESPACE, value: sre-agent}
            - {name: WORKFLOW_TEMPLATE, value: incident-investigation}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 15
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: alert-webhook
  namespace: sre-agent
spec:
  selector: {app.kubernetes.io/name: alert-webhook}
  ports:
    - {name: http, port: 8080, targetPort: http}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: alert-webhook
  namespace: sre-agent
spec:
  minAvailable: 1
  selector:
    matchLabels: {app.kubernetes.io/name: alert-webhook}
