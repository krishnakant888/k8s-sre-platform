# The incident investigation, run by Argo Workflows. The alert webhook creates one Workflow per firing alert
# from this template (agent/incident.py). Each step is the agent image running `python -m agent.steps <step>`.
#
#   settle -> collect -> analyze -> store -> notify
#
# Retries and timeouts per step replace what the old Temporal activities had. A failed step is retried with
# backoff, and the Workflow object keeps the history (kubectl -n sre-agent get wf, or the UI at workflows.localhost:9080).
# Data moves between steps as workflow parameters, written to /tmp/in as raw artifacts (no object store needed).
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: incident-investigation
  namespace: sre-agent
spec:
  entrypoint: investigate
  serviceAccountName: sre-agent
  activeDeadlineSeconds: 900
  podGC:
    strategy: OnWorkflowCompletion   # the logs of the steps are in Loki; the pods piled up by the hundred
  ttlStrategy:
    secondsAfterSuccess: 3600     # the report is a file on the volume; the Workflow object is 100+ KB of evidence
    secondsAfterFailure: 14400
  arguments:
    parameters:
      - name: alert
  volumes:
    - name: tmp
      emptyDir: {}
    - name: platform-reader   # read-only token and CA of the platform cluster, created by bootstrap.py
      secret: {secretName: platform-reader}
    - name: gitops-reader   # read-only token and CA of the gitops cluster (Argo CD Applications), created by bootstrap.py
      secret: {secretName: gitops-reader}
  templates:
    - name: investigate
      steps:
        - - name: settle
            template: settle
        - - name: collect
            template: collect
            arguments:
              parameters:
                - {name: alert, value: "{{workflow.parameters.alert}}"}
        - - name: analyze
            template: analyze
            arguments:
              parameters:
                - {name: alert, value: "{{workflow.parameters.alert}}"}
                - {name: ctx, value: "{{steps.collect.outputs.parameters.ctx}}"}
        - - name: store
            template: store
            arguments:
              parameters:
                - {name: report, value: "{{steps.analyze.outputs.parameters.report}}"}
        - - name: notify
            template: notify
            arguments:
              parameters:
                - {name: report, value: "{{steps.analyze.outputs.parameters.report}}"}

    # give metrics and logs a moment to catch up with the alert
    - name: settle
      suspend:
        duration: 20s

    - name: collect
      retryStrategy:
        limit: "3"
        backoff: {duration: 5s, factor: "2"}
      activeDeadlineSeconds: 180
      inputs:
        parameters:
          - name: alert
        artifacts:
          - name: alert
            path: /tmp/in/alert.json
            raw: {data: "{{inputs.parameters.alert}}"}
      container:
        image: ghcr.io/krishnakant888/sre-agent:sha-a5cdba3eb2fd2ef0c7f302f6003a0abb1eb71715
        command: [python, -m, agent.steps, collect]
        env:   # Mimir, Loki and Tempo are in this cluster (agent/config.py has their addresses); pods and events come from the platform cluster
          - {name: PLATFORM_K8S_URL, value: "https://platform-control-plane:6443"}
          - {name: GITOPS_K8S_URL, value: "https://gitops-control-plane:6443"}
        resources:
          requests: {cpu: 100m, memory: 256Mi}
          limits: {memory: 1Gi}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: [ALL]}
        volumeMounts:
          - {name: tmp, mountPath: /tmp}
          - {name: platform-reader, mountPath: /var/run/platform, readOnly: true}
          - {name: gitops-reader, mountPath: /var/run/gitops, readOnly: true}
      outputs:
        parameters:
          - name: ctx
            valueFrom: {path: /tmp/out/ctx.json}

    - name: analyze
      retryStrategy:
        limit: "3"
        backoff: {duration: 5s, factor: "2"}
      activeDeadlineSeconds: 300
      inputs:
        parameters:
          - name: alert
          - name: ctx
        artifacts:
          - name: alert
            path: /tmp/in/alert.json
            raw: {data: "{{inputs.parameters.alert}}"}
          - name: ctx
            path: /tmp/in/ctx.json
            raw: {data: "{{inputs.parameters.ctx}}"}
      container:
        image: ghcr.io/krishnakant888/sre-agent:sha-a5cdba3eb2fd2ef0c7f302f6003a0abb1eb71715
        command: [python, -m, agent.steps, analyze]
        env:
          - {name: WORKFLOW_NAME, value: "{{workflow.name}}"}   # recorded in the report: Argo Workflows keeps no history here
          - {name: WORKFLOW_CREATED, value: "{{workflow.creationTimestamp}}"}
          - {name: ANTHROPIC_MODEL, value: claude-sonnet-5-5}
          - {name: PLATFORM_K8S_URL, value: "https://platform-control-plane:6443"}
          - {name: GITOPS_K8S_URL, value: "https://gitops-control-plane:6443"}
          - name: ANTHROPIC_API_KEY   # absent: the agent runs its rule based analysis and says so in the report
            valueFrom: {secretKeyRef: {name: anthropic-api-key, key: ANTHROPIC_API_KEY, optional: true}}
          - name: GITHUB_TOKEN   # absent: remediation PRs are skipped; create with: kubectl -n sre-agent create secret generic github-token --from-literal=GITHUB_TOKEN=<pat>
            valueFrom: {secretKeyRef: {name: github-token, key: GITHUB_TOKEN, optional: true}}
          - {name: MAX_REPLICAS, value: "5"}        # scale-out ceiling; escalates to CPU vertical scale-up when reached
          - {name: MAX_CPU_LIMIT_M, value: "300"}   # temporary scaling drill ceiling
          - {name: MAX_MEMORY_LIMIT_MIB, value: "640"} # temporary scaling drill ceiling
        resources:
          requests: {cpu: 100m, memory: 512Mi}
          limits: {memory: 1536Mi}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: [ALL]}
        volumeMounts:
          - {name: tmp, mountPath: /tmp}
          - {name: platform-reader, mountPath: /var/run/platform, readOnly: true}
          - {name: gitops-reader, mountPath: /var/run/gitops, readOnly: true}
      outputs:
        parameters:
          - name: report
            valueFrom: {path: /tmp/out/report.json}

    - name: store
      retryStrategy:
        limit: "3"
        backoff: {duration: 5s, factor: "2"}
      activeDeadlineSeconds: 60
      inputs:
        parameters:
          - name: report
        artifacts:
          - name: report
            path: /tmp/in/report.json
            raw: {data: "{{inputs.parameters.report}}"}
      container:
        image: ghcr.io/krishnakant888/sre-agent:sha-a5cdba3eb2fd2ef0c7f302f6003a0abb1eb71715
        command: [python, -m, agent.steps, store]
        resources:
          requests: {cpu: 50m, memory: 128Mi}
          limits: {memory: 512Mi}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: [ALL]}
        volumeMounts:
          - {name: tmp, mountPath: /tmp}
          - {name: reports, mountPath: /reports}
      volumes:
        - name: reports
          persistentVolumeClaim: {claimName: rca-reports}
      outputs:
        parameters:
          - name: report-id
            valueFrom: {path: /tmp/out/report-id}

    - name: notify
      retryStrategy:
        limit: "3"
        backoff: {duration: 5s, factor: "2"}
      activeDeadlineSeconds: 60
      inputs:
        parameters:
          - name: report
        artifacts:
          - name: report
            path: /tmp/in/report.json
            raw: {data: "{{inputs.parameters.report}}"}
      container:
        image: ghcr.io/krishnakant888/sre-agent:sha-a5cdba3eb2fd2ef0c7f302f6003a0abb1eb71715
        command: [python, -m, agent.steps, notify]
        env:
          - name: NOTIFY_WEBHOOK_URL
            valueFrom: {secretKeyRef: {name: notify-webhook, key: url, optional: true}}
        resources:
          requests: {cpu: 50m, memory: 128Mi}
          limits: {memory: 512Mi}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: [ALL]}
        volumeMounts:
          - {name: tmp, mountPath: /tmp}
