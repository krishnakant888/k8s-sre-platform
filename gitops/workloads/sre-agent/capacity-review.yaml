# Weekly health reports: restart storm, HPA saturation, change risk (read-only, no Git mutations).
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: weekly-health-review
  namespace: sre-agent
spec:
  entrypoint: review
  serviceAccountName: sre-agent
  activeDeadlineSeconds: 1800
  arguments:
    parameters:
      - {name: workloads, value: "orders-api:demo,frontend:demo,dummy-shop:sandbox"}
  podGC:
    strategy: OnWorkflowCompletion
  ttlStrategy:
    secondsAfterSuccess: 3600
    secondsAfterFailure: 14400
  templates:
    - name: review
      container:
        image: ghcr.io/krishnakant888/sre-agent:sha-4a8ca4f9994569211f2950a561b3d7aed7d93645
        command: [python, -m, agent.steps, weekly-health-review]
        env:
          - name: GITHUB_TOKEN
            valueFrom: {secretKeyRef: {name: github-token, key: GITHUB_TOKEN, optional: true}}
          - name: GRAFANA_API_TOKEN
            valueFrom: {secretKeyRef: {name: rca-viewer-grafana, key: token, optional: true}}
          - {name: GRAFANA_URL, value: "http://grafana.observability.svc.cluster.local"}
          - {name: HEALTH_WORKLOADS, value: "{{workflow.parameters.workloads}}"}
          - {name: HEALTH_CLUSTER, value: platform}
          - {name: HEALTH_WINDOW, value: 7d}
          - {name: RESTART_STORM_THRESHOLD, value: "5"}
          - {name: HPA_SATURATION_RATIO, value: "0.10"}
          - {name: CHANGE_RISK_DEPLOY_HOURS, value: "168"}
          - {name: CHANGE_RISK_ERROR_FACTOR, value: "2.0"}
          - {name: WORKFLOW_NAME, value: "{{workflow.name}}"}
        resources:
          requests: {cpu: 50m, memory: 128Mi}
          limits: {memory: 512Mi}
        volumeMounts:
          - {name: reports, mountPath: /reports}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: [ALL]}
      volumes:
        - name: reports
          persistentVolumeClaim: {claimName: rca-reports}
---
apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: sre-weekly-health-review
  namespace: sre-agent
spec:
  schedules: ["0 8 * * 1"]
  timezone: Asia/Kolkata
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  workflowSpec:
    workflowTemplateRef:
      name: weekly-health-review
---
# Self-learning: re-diagnose unknowns, track gaps→issues, calibrate confidence, tune thresholds.
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: self-learning
  namespace: sre-agent
spec:
  entrypoint: review
  serviceAccountName: sre-agent
  activeDeadlineSeconds: 3600
  podGC:
    strategy: OnWorkflowCompletion
  ttlStrategy:
    secondsAfterSuccess: 3600
    secondsAfterFailure: 86400
  templates:
    - name: review
      container:
        image: ghcr.io/krishnakant888/sre-agent:sha-4a8ca4f9994569211f2950a561b3d7aed7d93645
        command: [python, -m, agent.steps, self-learning-review]
        env:
          - name: GITHUB_TOKEN
            valueFrom: {secretKeyRef: {name: github-token, key: GITHUB_TOKEN, optional: true}}
          - name: GRAFANA_API_TOKEN
            valueFrom: {secretKeyRef: {name: rca-viewer-grafana, key: token, optional: true}}
          - {name: GRAFANA_URL, value: "http://grafana.observability.svc.cluster.local"}
          - {name: LEARNING_ISSUES_REPO, value: "krishnakant888/k8s-sre-platform"}
          - {name: GAP_ISSUE_MIN_COUNT, value: "3"}
          - {name: REDIAGNOSIS_MIN_AGE_HOURS, value: "2"}
          - {name: CPU_P95_MAX_DEFAULT, value: "0.50"}
          - {name: MEMORY_P99_MAX_DEFAULT, value: "0.60"}
          - {name: WORKFLOW_NAME, value: "{{workflow.name}}"}
        resources:
          requests: {cpu: 50m, memory: 128Mi}
          limits: {memory: 512Mi}
        volumeMounts:
          - {name: reports, mountPath: /reports}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities: {drop: [ALL]}
      volumes:
        - name: reports
          persistentVolumeClaim: {claimName: rca-reports}
---
apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: sre-self-learning
  namespace: sre-agent
spec:
  schedules: ["30 3 * * 0"]
  timezone: Asia/Kolkata
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 5
  workflowSpec:
    workflowTemplateRef:
      name: self-learning
---
# One-time Job: purge old capacity and weekly-floor reports from the reports PVC.
apiVersion: batch/v1
kind: Job
metadata:
  name: purge-capacity-reports
  namespace: sre-agent
spec:
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: purge
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              find /reports -maxdepth 1 -type d \( -name 'rca-capacity-*' -o -name 'rca-weekly-*' \) -exec rm -rf {} + 2>/dev/null; echo "purge done"
          volumeMounts:
            - {name: reports, mountPath: /reports}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities: {drop: [ALL]}
      volumes:
        - name: reports
          persistentVolumeClaim: {claimName: rca-reports}
