# The RCA report viewer, at https://reports.localhost:9443 (behind the gateway login).
#   /            the viewer page (files/rca-ui) for a browser; the plain directory listing for anything else (scripts, the portal card)
#   /_list/      the same listing as JSON, which the page reads
#   /_status/rules   the state of Grafana's alert rules (GET only): the page uses it to show whether the alert of a report is still firing.
#                    The token of a Viewer service account is in the Secret rca-viewer-grafana (bootstrap.py --viewer-access); without it the page shows "unknown"
#   /<id>/rca.md and /<id>/report.json   the files of a report, served as plain text so a browser shows them instead of downloading
apiVersion: v1
kind: ConfigMap
metadata:
  name: rca-viewer-nginx
  namespace: sre-agent
data:
  nginx.conf: |
    worker_processes 1;
    error_log /dev/stderr warn;
    pid /tmp/nginx.pid;
    events { worker_connections 256; }
    http {
      include /etc/nginx/mime.types;
      client_body_temp_path /tmp/client_temp;
      proxy_temp_path /tmp/proxy_temp;
      fastcgi_temp_path /tmp/fcgi_temp;
      uwsgi_temp_path /tmp/uwsgi_temp;
      scgi_temp_path /tmp/scgi_temp;
      access_log /dev/stdout;
      resolver 10.96.0.10 valid=20s ipv6=off;   # kube-dns of the kind clusters: the Grafana address is resolved per request, so the viewer starts without Grafana

      server {
        listen 8080;
        root /reports;
        location = /healthz { access_log off; return 200 "ok\n"; }
        location /ui/ {   # the page: files/rca-ui, mounted from the ConfigMap rca-viewer-ui
          alias /ui/;
          add_header Cache-Control no-cache;
          add_header X-Content-Type-Options nosniff;
          add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-ancestors 'self'";
        }
        location = /_status/rules {
          limit_except GET { deny all; }
          set $grafana http://grafana.observability.svc.cluster.local;
          include /secrets/*.conf;   # proxy_set_header Authorization "Bearer <token>";
          proxy_pass $grafana/api/prometheus/grafana/api/v1/rules;
          proxy_read_timeout 10s;
          add_header Cache-Control no-store;
        }
        location /_list/ {
          alias /reports/;
          autoindex on;
          autoindex_format json;
          default_type application/json;
          add_header Cache-Control no-store;
        }
        location = / {
          if ($http_accept ~* "text/html") { rewrite ^ /ui/index.html last; }
          autoindex on;
          add_header X-Content-Type-Options nosniff;
        }
        location / {
          autoindex on;
          types { text/plain md json; }
          default_type text/plain;
          add_header X-Content-Type-Options nosniff;
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rca-viewer
  namespace: sre-agent
  labels: {app.kubernetes.io/name: rca-viewer, app.kubernetes.io/version: "1.0.0", team: platform}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: rca-viewer}
  template:
    metadata:
      labels: {app.kubernetes.io/name: rca-viewer, app.kubernetes.io/version: "1.0.0", team: platform}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: nginx-conf, mountPath: /etc/nginx/nginx.conf, subPath: nginx.conf}
            - {name: reports, mountPath: /reports, readOnly: true}
            - {name: ui, mountPath: /ui, readOnly: true}
            - {name: grafana-auth, mountPath: /secrets, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: nginx-conf
          configMap: {name: rca-viewer-nginx}
        - name: reports
          persistentVolumeClaim: {claimName: rca-reports, readOnly: true}
        - name: ui
          configMap: {name: rca-viewer-ui}
        - name: grafana-auth
          secret: {secretName: rca-viewer-grafana, optional: true}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: rca-viewer
  namespace: sre-agent
  labels: {app.kubernetes.io/name: rca-viewer, app.kubernetes.io/version: "1.0.0", team: platform}
spec:
  selector: {app.kubernetes.io/name: rca-viewer}
  ports:
    - {name: http, port: 80, targetPort: http}
