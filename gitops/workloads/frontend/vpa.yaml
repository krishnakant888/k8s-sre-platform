apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: frontend
  namespace: demo
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: frontend
  updatePolicy:
    # Initial: applies right-sized requests/limits only when pods are created.
    # Safe alongside HPA (no eviction of running pods, no conflict on CPU metric).
    updateMode: "Initial"
  resourcePolicy:
    containerPolicies:
      - containerName: frontend
        minAllowed:
          cpu: 25m
          memory: 64Mi
        maxAllowed:
          cpu: 2000m
          memory: 1Gi
        controlledResources: ["cpu", "memory"]
