apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: demo
  labels: {app.kubernetes.io/name: frontend}
spec:
  selector: {app.kubernetes.io/name: frontend}
  ports:
    - {name: http, port: 80, targetPort: http}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: frontend
  namespace: demo
spec:
  parentRefs:
    - {name: platform, namespace: traefik}
  hostnames: [frontend.localhost]
  rules:
    - backendRefs:
        - {name: frontend, port: 80}
