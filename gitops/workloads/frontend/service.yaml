apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: demo
  labels: {app.kubernetes.io/name: frontend}
spec:
  selector: {app.kubernetes.io/name: frontend}
  ports:
    - {name: http, port: 80, targetPort: http}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend
  namespace: demo
spec:
  ingressClassName: traefik
  rules:
    - host: frontend.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port: {name: http}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: frontend
  namespace: demo
spec:
  minAvailable: 1
  selector:
    matchLabels: {app.kubernetes.io/name: frontend}
