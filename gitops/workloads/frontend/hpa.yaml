apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: frontend
  namespace: demo
spec:
  scaleTargetRef:
    name: frontend
  minReplicaCount: 1
  maxReplicaCount: 10
  cooldownPeriod: 300
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://mimir.observability:8080/prometheus
        metricName: nginx_http_requests_total
        # scale out when RPS per pod exceeds 50
        query: sum(rate(nginx_http_requests_total{namespace="demo"}[1m]))
        threshold: "50"
