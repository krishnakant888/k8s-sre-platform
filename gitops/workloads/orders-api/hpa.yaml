apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: orders-api
  namespace: demo
spec:
  scaleTargetRef:
    name: orders-api
  minReplicaCount: 2
  maxReplicaCount: 10
  cooldownPeriod: 300
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://mimir.observability:8080/prometheus
        metricName: http_requests_total
        # scale out when RPS per pod exceeds 20
        query: sum(rate(http_requests_total{namespace="demo",service="orders-api"}[2m]))
        threshold: "20"
