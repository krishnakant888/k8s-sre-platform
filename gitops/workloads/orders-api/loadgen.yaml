apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgen
  namespace: demo
  labels: {app.kubernetes.io/name: loadgen}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: loadgen}
  template:
    metadata:
      labels: {app.kubernetes.io/name: loadgen}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: loadgen
          image: ghcr.io/krishnakant888/orders-api:sha-b4b7facb8724e4d9653aa506b282a58593b2a4af
          command: [python, -m, app.loadgen]
          env:
            - {name: TARGET, value: "http://orders-api"}
            - {name: RATE, value: "5"}
          resources:
            requests: {cpu: 20m, memory: 64Mi}
            limits: {memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
