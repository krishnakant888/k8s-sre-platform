apiVersion: v1
kind: Service
metadata:
  name: orders-api
  namespace: demo
  labels: {app.kubernetes.io/name: orders-api}
spec:
  selector: {app.kubernetes.io/name: orders-api}
  ports:
    - {name: http, port: 80, targetPort: http}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: orders-api
  namespace: demo
spec:
  parentRefs:
    - {name: platform, namespace: traefik}
  hostnames: [orders.localhost]
  rules:
    - backendRefs:
        - {name: orders-api, port: 80}
