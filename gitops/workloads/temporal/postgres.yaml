# Postgres for temporal, managed by the cloudnative-pg operator.
# One instance on a PVC here; in production set instances: 3 and add a backup section (object store or volume snapshots).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: temporal-db
  namespace: temporal
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:16.6
  primaryUpdateStrategy: unsupervised
  bootstrap:
    initdb:
      database: temporal
      owner: temporal
      postInitSQL:
        - CREATE DATABASE temporal_visibility OWNER temporal
  postgresql:
    parameters:
      max_connections: "200"
      shared_buffers: 128MB
  storage:
    size: 5Gi
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 512Mi}
  enableSuperuserAccess: false
