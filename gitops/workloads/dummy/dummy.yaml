# A deliberately plain web app: no OTel SDK. Trace context arrives via the traceparent header forwarded by the
# gateway; nginx logs it as trace_id so each request links back to its distributed trace.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dummy-shop-nginx-conf
  namespace: sandbox
data:
  trace-logging.conf: |
    log_format json_trace escape=json
      '{"ts":"$time_iso8601","service":"dummy-shop",'
      '"method":"$request_method","path":"$uri","status":$status,'
      '"bytes":$body_bytes_sent,"duration":$request_time,'
      '"trace_id":"$http_traceparent","request_id":"$http_x_request_id"}';
    access_log /dev/stdout json_trace;
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dummy-shop
  namespace: sandbox
  labels: &labels
    app.kubernetes.io/name: dummy-shop
    app.kubernetes.io/version: "1.0.0"
    team: demo
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: dummy-shop}
  template:
    metadata:
      labels: *labels
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app.kubernetes.io/name: dummy-shop}
      containers:
        - name: web
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: {cpu: 25m, memory: 8Mi}
            limits: {memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: nginx-conf, mountPath: /etc/nginx/conf.d/trace-logging.conf, subPath: trace-logging.conf, readOnly: true}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: nginx-conf
          configMap: {name: dummy-shop-nginx-conf}
---
apiVersion: v1
kind: Service
metadata:
  name: dummy-shop
  namespace: sandbox
  labels: {app.kubernetes.io/name: dummy-shop}
spec:
  selector: {app.kubernetes.io/name: dummy-shop}
  ports:
    - {name: http, port: 80, targetPort: http}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dummy-shop
  namespace: sandbox
spec:
  parentRefs:
    - {name: platform, namespace: traefik}
  hostnames: [dummy.localhost]
  rules:
    - backendRefs:
        - {name: dummy-shop, port: 80}
