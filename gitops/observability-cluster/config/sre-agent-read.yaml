# The SRE agent investigates workloads of the observability cluster too, through its own service account:
# read-only on pods, events and workloads in every namespace, nothing else.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sre-agent-local-read
rules:
  - apiGroups: [""]
    resources: [pods, events, nodes]
    verbs: [get, list]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets, replicasets]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sre-agent-local-read
subjects:
  - {kind: ServiceAccount, name: sre-agent, namespace: sre-agent}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: sre-agent-local-read
