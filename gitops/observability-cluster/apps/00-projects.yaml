apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  description: Observability cluster add-ons (ingress-nginx, argo-workflows, base namespaces)
  sourceRepos:
    - https://github.com/krishnakant888/k8s-sre-platform.git
    - https://argoproj.github.io/argo-helm
    - https://kubernetes.github.io/ingress-nginx
  destinations:
    - name: in-cluster
      namespace: "*"
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: observability
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  description: LGTM stack, alloy, alerting (observability cluster)
  sourceRepos:
    - https://github.com/krishnakant888/k8s-sre-platform.git
    - https://grafana.github.io/helm-charts
    - https://prometheus-community.github.io/helm-charts
  destinations:
    - name: in-cluster
      namespace: observability
  clusterResourceWhitelist:
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: sre-agent
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  description: The SRE agent (alert webhook, workflow template, RCA viewer). It runs here and investigates the platform cluster.
  sourceRepos:
    - https://github.com/krishnakant888/k8s-sre-platform.git
  destinations:
    - name: in-cluster
      namespace: sre-agent
    - name: in-cluster
      namespace: argocd   # the read-only Role on Applications, so the agent can read deploy history
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
