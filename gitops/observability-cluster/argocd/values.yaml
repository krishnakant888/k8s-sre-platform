# The one Argo CD, in the observability cluster. It deploys that cluster (itself included) and the platform cluster, which
# bootstrap.py registers in it. It runs outside production on purpose: it keeps working while the platform cluster is down or being
# rebuilt. (Two clusters instead of three saves a node and a collector; the price is that Argo CD shares a cluster with the observability stack.)
#
# Sizing (about 30 applications across two clusters): requests are what the scheduler reserves, memory limits are
# 2x the request so a busy sync cannot grow without bound but a spike does not OOMKill it (the application controller
# keeps every managed object of both clusters in memory), and CPU limits are generous, 4x the request, because a
# tight CPU limit throttles the controller and slows every sync without protecting anything.
# For a real setup also run server and repoServer with replicas: 2 and pdb.enabled: true, and shard the controller
# (controller.replicas) once it manages a few hundred applications.
global:
  domain: argocd.localhost

configs:
  params:
    server.insecure: true   # TLS ends at the ingress controller
  cm:
    admin.enabled: true
    exec.enabled: false

  rbac:
    policy.default: role:readonly
    scopes: "[groups]"

dex:
  enabled: false

notifications:
  enabled: false

# renders manifests (helm template, kustomize build) for every sync: short CPU and memory spikes
repoServer:
  resources:
    requests: {cpu: 500m, memory: 1Gi}
    limits: {cpu: "4", memory: 2Gi}

# the UI and API
server:
  ingress:
    enabled: true
    ingressClassName: nginx
  resources:
    requests: {cpu: 200m, memory: 512Mi}
    limits: {cpu: "2", memory: 1Gi}

# reconciles every application of both clusters against its cluster
controller:
  resources:
    requests: {cpu: "1", memory: 2Gi}
    limits: {cpu: "4", memory: 4Gi}

# cache of rendered manifests and application state
redis:
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "1", memory: 512Mi}

# the chart has no switch for it; it is not used, so it is kept small
applicationSet:
  resources:
    requests: {cpu: 20m, memory: 128Mi}
    limits: {memory: 512Mi}

# one-shot job that creates the redis password secret
redisSecretInit:
  resources:
    requests: {cpu: 20m, memory: 64Mi}
    limits: {cpu: 200m, memory: 128Mi}
