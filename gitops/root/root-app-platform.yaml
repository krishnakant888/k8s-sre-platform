apiVersion: argoproj.io/v1alpha1
# The apps of the platform cluster. This Application lives in the monitoring cluster (where the one Argo CD runs)
# and creates one child Application per component of gitops/apps; each child deploys into the cluster "platform".
kind: Application
metadata:
  name: root-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/krishnakant888/k8s-sre-platform.git
    targetRevision: main
    path: gitops/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
