# read-only access for the sre agent to what it investigates. It cannot change anything outside its own namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sre-agent-read
  namespace: demo
rules:
  - apiGroups: [""]
    resources: [pods, events]
    verbs: [get, list]
  - apiGroups: [apps]
    resources: [deployments, replicasets]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sre-agent-read
  namespace: demo
subjects:
  - {kind: ServiceAccount, name: sre-agent, namespace: sre-agent}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sre-agent-read
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sre-agent-read-applications
  namespace: argocd
rules:
  - apiGroups: [argoproj.io]
    resources: [applications]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sre-agent-read-applications
  namespace: argocd
subjects:
  - {kind: ServiceAccount, name: sre-agent, namespace: sre-agent}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sre-agent-read-applications
