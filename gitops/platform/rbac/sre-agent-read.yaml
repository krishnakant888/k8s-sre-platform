# read-only access for the sre agent to what it investigates, in every namespace (an incident can be anywhere).
# It cannot change anything outside its own namespace, and cannot read secrets or configmaps.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sre-agent-read
rules:
  - apiGroups: [""]
    resources: [pods, events, nodes]
    verbs: [get, list]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets, replicasets]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sre-agent-read
subjects:
  - {kind: ServiceAccount, name: sre-agent, namespace: sre-agent}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: sre-agent-read
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sre-agent-read-applications
  namespace: argocd
rules:
  - apiGroups: [argoproj.io]
    resources: [applications]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sre-agent-read-applications
  namespace: argocd
subjects:
  - {kind: ServiceAccount, name: sre-agent, namespace: sre-agent}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sre-agent-read-applications
