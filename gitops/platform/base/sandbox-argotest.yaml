# sre-platform/expires: 2026-11-08T13:02:23Z
# A sandbox namespace requested from the developer portal (scripts/selfservice.py sandbox). It is removed when the time above passes.
apiVersion: v1
kind: Namespace
metadata:
  name: sbx-argotest
  labels:
    app.kubernetes.io/part-of: platform
    sre-platform/owner: "platform-team"
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: sbx-argotest
spec:
  limits:
    - type: Container
      defaultRequest: {cpu: 25m, memory: 64Mi}
      default: {memory: 256Mi}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: sbx-argotest
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: sbx-argotest
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-gateway-and-collector
  namespace: sbx-argotest
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: traefik}
          podSelector:
            matchLabels: {app.kubernetes.io/name: traefik}
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: observability}
          podSelector:
            matchLabels: {app.kubernetes.io/name: alloy}
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: sandbox-quota
  namespace: sbx-argotest
spec:
  hard: {requests.cpu: "1", limits.memory: 1Gi, pods: "20", services: "10"}
