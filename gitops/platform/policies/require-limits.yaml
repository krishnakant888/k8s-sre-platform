apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-resources
  annotations:
    policies.kyverno.io/description: Containers must set cpu/memory requests and a memory limit.
spec:
  validationFailureAction: Audit
  validationFailureActionOverrides:
    - action: Enforce
      namespaces: [demo, sre-agent]
  background: true
  rules:
    - name: containers-have-resources
      match:
        any:
          - resources:
              kinds: [Pod]
      validate:
        message: "cpu and memory requests and a memory limit are required"
        pattern:
          spec:
            containers:
              - resources:
                  requests:
                    cpu: "?*"
                    memory: "?*"
                  limits:
                    memory: "?*"
