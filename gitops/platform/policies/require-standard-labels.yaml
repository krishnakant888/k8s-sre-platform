apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-standard-labels
  annotations:
    policies.kyverno.io/description: Pods of our namespaces carry the labels the dashboards, alerts and the SRE agent group by.
spec:
  validationFailureAction: Audit   # reported in the policy report, not blocking: third-party charts and batch pods are in these namespaces too
  background: true
  rules:
    - name: standard-labels
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [demo, sandbox, sre-agent]
      validate:
        message: "label app.kubernetes.io/name, app.kubernetes.io/version and team are required"
        pattern:
          metadata:
            labels:
              app.kubernetes.io/name: "?*"
              app.kubernetes.io/version: "?*"
              team: "?*"
