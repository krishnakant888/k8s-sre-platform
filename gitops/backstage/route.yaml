# The portal has no login beyond the guest sign-in, and it is read-only: it shows the catalog and the clusters.
# The route lives here, not with the gateway's, because it needs the portal namespace to exist.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: portal
spec:
  parentRefs:
    - {name: platform, namespace: traefik}
  hostnames: [portal.localhost]
  rules:
    - backendRefs:
        - {name: portal, port: 80}
