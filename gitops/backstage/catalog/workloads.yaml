# The applications of the platform: what users reach and the SRE agent.
# Annotations the portal's plugins use:
#   backstage.io/kubernetes-*   pods and deployments of the component, read from the clusters (Kubernetes tab)
#   argocd/app-name             the Argo CD application that deploys it (Argo CD card)
#   grafana/alert-label-selector  the alerts whose labels match are shown on the component (Grafana alerts card)
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: orders-api
  description: Sample orders API with an SLO, traces, structured logs and fault injection for the drills
  tags: [python, fastapi, slo]
  annotations:
    github.com/project-slug: krishnakant888/k8s-sre-platform
    backstage.io/source-location: url:https://github.com/krishnakant888/k8s-sre-platform/tree/main/apps/orders-api
    backstage.io/kubernetes-label-selector: app.kubernetes.io/name=orders-api
    backstage.io/kubernetes-namespace: demo
    argocd/app-name: platform-orders-api
    grafana/alert-label-selector: service=orders-api
  links:
    - {url: "https://grafana.localhost:9443/d/orders-api", title: "Dashboard: RED and SLO", icon: dashboard}
    - {url: "https://reports.localhost:9443", title: RCA reports, icon: docs}
    - {url: "https://github.com/krishnakant888/k8s-sre-platform/blob/main/docs/runbooks/orders-api.md", title: Runbook, icon: docs}
    - {url: "https://orders.localhost:8443/orders", title: Open the API, icon: web}
spec:
  type: service
  lifecycle: production
  owner: group:platform-team
  system: workloads
  providesApis: [orders-api-http]
  dependsOn: [resource:cluster-platform]
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: loadgen
  description: Steady synthetic traffic against orders-api, so the dashboards and the SLO always have data
  tags: [python]
  annotations:
    github.com/project-slug: krishnakant888/k8s-sre-platform
    backstage.io/source-location: url:https://github.com/krishnakant888/k8s-sre-platform/tree/main/apps/orders-api
    backstage.io/kubernetes-label-selector: app.kubernetes.io/name=loadgen
    backstage.io/kubernetes-namespace: demo
    argocd/app-name: platform-orders-api
spec:
  type: service
  lifecycle: production
  owner: group:platform-team
  system: workloads
  subcomponentOf: component:orders-api
  dependsOn: [component:orders-api]
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: frontend
  description: Stateless nginx frontend that logs one JSON line per request
  tags: [nginx]
  annotations:
    github.com/project-slug: krishnakant888/k8s-sre-platform
    backstage.io/source-location: url:https://github.com/krishnakant888/k8s-sre-platform/tree/main/gitops/workloads/frontend
    backstage.io/kubernetes-label-selector: app.kubernetes.io/name=frontend
    backstage.io/kubernetes-namespace: demo
    argocd/app-name: platform-frontend
    grafana/alert-label-selector: service=frontend
  links:
    - {url: "https://frontend.localhost:8443", title: Open the frontend, icon: web}
spec:
  type: website
  lifecycle: production
  owner: group:platform-team
  system: workloads
  dependsOn: [resource:cluster-platform]
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: dummy-shop
  description: "A deliberately plain web app with no metrics endpoint: everything about it comes from the platform (the observability coverage test)"
  tags: [nginx, coverage-test]
  annotations:
    github.com/project-slug: krishnakant888/k8s-sre-platform
    backstage.io/source-location: url:https://github.com/krishnakant888/k8s-sre-platform/tree/main/gitops/workloads/dummy
    backstage.io/kubernetes-label-selector: app.kubernetes.io/name=dummy-shop
    backstage.io/kubernetes-namespace: sandbox
    argocd/app-name: platform-dummy-shop
spec:
  type: website
  lifecycle: experimental
  owner: group:platform-team
  system: workloads
  dependsOn: [resource:cluster-platform]
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: alert-webhook
  description: Receives Grafana alerts and starts an investigation workflow per alert; the steps (collect, analyze, store, notify) run the same image
  tags: [python, sre-agent, rca]
  annotations:
    github.com/project-slug: krishnakant888/k8s-sre-platform
    backstage.io/source-location: url:https://github.com/krishnakant888/k8s-sre-platform/tree/main/apps/sre-agent
    backstage.io/kubernetes-label-selector: app.kubernetes.io/name=alert-webhook
    backstage.io/kubernetes-namespace: sre-agent
    argocd/app-name: observability-sre-agent
    grafana/alert-label-selector: service=sre-agent
  links:
    - {url: "https://workflows.localhost:9443", title: Investigations (Argo Workflows), icon: dashboard}
    - {url: "https://reports.localhost:9443", title: RCA reports, icon: docs}
    - {url: "https://github.com/krishnakant888/k8s-sre-platform/blob/main/docs/observability-architecture.md", title: Architecture and RCA design, icon: docs}
spec:
  type: service
  lifecycle: production
  owner: group:platform-team
  system: sre-agent
  dependsOn: [resource:cluster-observability, component:grafana, component:mimir, component:loki, component:tempo]
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: rca-viewer
  description: Read-only viewer of the RCA reports the agent writes (behind the gateway's basic-auth login)
  tags: [nginx, sre-agent, rca]
  annotations:
    github.com/project-slug: krishnakant888/k8s-sre-platform
    backstage.io/source-location: url:https://github.com/krishnakant888/k8s-sre-platform/tree/main/gitops/workloads/sre-agent
    backstage.io/kubernetes-label-selector: app.kubernetes.io/name=rca-viewer
    backstage.io/kubernetes-namespace: sre-agent
    argocd/app-name: observability-sre-agent
  links:
    - {url: "https://reports.localhost:9443", title: Open the reports, icon: docs}
spec:
  type: website
  lifecycle: production
  owner: group:platform-team
  system: sre-agent
  dependsOn: [component:alert-webhook]
