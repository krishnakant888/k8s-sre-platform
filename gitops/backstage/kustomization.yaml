# The developer portal (Backstage) of the platform, in the gitops cluster. The Backstage app itself (plugins, the new-service
# template) is built from the backstage-portal repo; this directory holds how it runs here and the catalog it shows.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: portal
resources:
  - postgres.yaml
  - portal.yaml
  - route.yaml
configMapGenerator:
  # app-config for this environment: guest sign-in, the three clusters, Argo CD and Grafana (tokens come from portal-secrets)
  - name: portal-config
    files:
      - app-config.k8s.yaml
  # the software catalog: every file under catalog/ (Backstage reads /catalog/all.yaml)
  - name: portal-catalog
    files:
      - catalog/all.yaml
      - catalog/org.yaml
      - catalog/systems.yaml
      - catalog/resources.yaml
      - catalog/workloads.yaml
      - catalog/platform.yaml
      - catalog/apis.yaml
