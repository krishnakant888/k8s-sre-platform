# The portal's database (Backstage keeps the catalog, scaffolder tasks and search index here).
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels: {app.kubernetes.io/name: postgres, app.kubernetes.io/part-of: portal}
spec:
  clusterIP: None
  selector: {app.kubernetes.io/name: postgres}
  ports:
    - {name: postgres, port: 5432, targetPort: postgres}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels: {app.kubernetes.io/name: postgres, app.kubernetes.io/part-of: portal}
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: postgres}
  template:
    metadata:
      labels: {app.kubernetes.io/name: postgres, app.kubernetes.io/part-of: portal}
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - {name: postgres, containerPort: 5432}
          env:
            - {name: POSTGRES_USER, value: backstage}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: portal-secrets, key: POSTGRES_PASSWORD}}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          readinessProbe:
            exec: {command: [sh, -c, "pg_isready -U backstage -h 127.0.0.1"]}
            periodSeconds: 10
          livenessProbe:
            exec: {command: [sh, -c, "pg_isready -U backstage -h 127.0.0.1"]}
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:   # not measured yet, see docs/RESOURCES.md
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 384Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: run, mountPath: /var/run/postgresql}
      volumes:
        - name: run
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 2Gi}
