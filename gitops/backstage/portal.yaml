apiVersion: v1
kind: ServiceAccount
metadata:
  name: portal
  labels: {app.kubernetes.io/name: portal}
automountServiceAccountToken: false   # the portal reads the clusters with the tokens in portal-secrets, not with its own
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal
  labels: {app.kubernetes.io/name: portal, app.kubernetes.io/version: "0.1.0", team: platform}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: portal}
  template:
    metadata:
      labels: {app.kubernetes.io/name: portal, app.kubernetes.io/version: "0.1.0", team: platform}
    spec:
      serviceAccountName: portal
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: portal
          # built from the portal/ folder of this repo; on this machine it is loaded into the kind node (see docs/portal.md)
          image: ghcr.io/krishnakant888/backstage-portal:0.1.0
          imagePullPolicy: IfNotPresent
          command: [node, packages/backend, --config, app-config.yaml, --config, app-config.production.yaml, --config, /config/app-config.k8s.yaml]
          ports:
            - {name: http, containerPort: 7007}
          envFrom:
            - secretRef: {name: portal-secrets}
          env:
            - {name: NODE_ENV, value: production}
            - {name: NODE_OPTIONS, value: "--max-old-space-size=768"}
          readinessProbe:
            httpGet: {path: /.backstage/health/v1/readiness, port: http}
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /.backstage/health/v1/liveness, port: http}
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:   # not measured yet, see docs/RESOURCES.md
            requests: {cpu: 200m, memory: 640Mi}
            limits: {memory: 1280Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: config, mountPath: /config, readOnly: true}
            - {name: catalog, mountPath: /catalog, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          configMap: {name: portal-config}
        - name: catalog
          configMap: {name: portal-catalog}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: portal
  labels: {app.kubernetes.io/name: portal}
spec:
  selector: {app.kubernetes.io/name: portal}
  ports:
    - {name: http, port: 80, targetPort: http}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: portal
spec:
  maxUnavailable: 1   # one replica: the portal is not a user-facing service, a node drain may take it down
  selector:
    matchLabels: {app.kubernetes.io/name: portal}
