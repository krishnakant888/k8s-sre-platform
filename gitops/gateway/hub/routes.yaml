# Argo CD has its own login, so its route needs none. The server runs with server.insecure: TLS ends at the gateway.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: argocd
spec:
  parentRefs:
    - {name: platform, namespace: traefik}
  hostnames: [argocd.localhost]
  rules:
    - backendRefs:
        - {name: argocd-server, port: 80}
