name: sre-agent

on:
  pull_request:
    paths: ["apps/sre-agent/**", ".github/workflows/sre-agent.yaml"]
  push:
    branches: [main]
    paths: ["apps/sre-agent/**", ".github/workflows/sre-agent.yaml"]

env:
  IMAGE: ghcr.io/krishnakant888/sre-agent

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r apps/sre-agent/requirements-dev.txt
      - run: python -m pytest -q
        working-directory: apps/sre-agent

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: log in to ghcr
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: apps/sre-agent
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: scan dependencies
        run: |
          docker run --rm -v "$PWD/apps/sre-agent:/src:ro" aquasec/trivy:0.58.1 \
            fs --severity CRITICAL,HIGH --ignore-unfixed --exit-code 0 /src
      - name: point the deployments at the new image
        if: github.ref == 'refs/heads/main'
        run: |
          [ -d gitops/workloads/sre-agent ] || { echo "no deployment yet"; exit 0; }
          sed -i "s#\(image: ${IMAGE}\):.*#\1:sha-${GITHUB_SHA}#" gitops/workloads/sre-agent/*.yaml
          git config user.name "sre-agent ci"
          git config user.email "ci@users.noreply.github.com"
          git add gitops/workloads/sre-agent
          git diff --cached --quiet && exit 0
          git commit -m "chore: sre-agent image sha-${GITHUB_SHA::7}"
          git pull --rebase -q origin main
          git push -q origin main
