name: selfservice

# Runs the changes asked for in the developer portal (scripts/selfservice.py) and opens a pull request with the result. The portal starts it with
# the `github:actions:dispatch` scaffolder action; the schedule removes sandboxes, access and drills whose time is up.
# Needs: Settings > Actions > General > "Allow GitHub Actions to create and approve pull requests", and Settings > General > "Allow auto-merge".
# Every request is merged by the workflow itself once the lint checks pass; a request whose checks fail stays open as a pull request.

run-name: "selfservice: ${{ inputs.action || 'expire' }} (requested by ${{ inputs.requested_by || 'the schedule' }})"

on:
  workflow_dispatch:
    inputs:
      action:
        description: What to do
        required: true
        type: choice
        options: [scale, resources, env, image, rollback, route, promote, alert, dashboard, sandbox, access, drill, expire]
      params:
        description: Parameters as a JSON object (see scripts/selfservice.py)
        required: true
        default: "{}"
      requested_by:
        description: Who asked, for the pull request text
        required: false
        default: the developer portal
  schedule:
    - cron: "*/30 * * * *"

concurrency:
  group: selfservice
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: write   # to start the lint checks on the branch of the pull request

jobs:
  change:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # runs wait for each other (concurrency), but a run is pinned to the commit of the moment it was dispatched: take the latest main, so a request
          # made while another one was running does not start from a main that is already behind and conflict with it
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 80
      - run: pip install pyyaml==6.0.2 yamllint==1.35.1
      - name: Make the change
        id: change
        env:   # through the environment, never pasted into the script text
          ACTION: ${{ inputs.action || 'expire' }}
          PARAMS: ${{ inputs.params || '{}' }}
        run: |
          set +e
          python3 scripts/selfservice.py "$ACTION" "$PARAMS" > "$RUNNER_TEMP/result.json" 2> "$RUNNER_TEMP/err.txt"
          code=$?
          set -e
          cat "$RUNNER_TEMP/err.txt" >&2
          if [ "$code" -ne 0 ]; then
            if [ "$ACTION" = expire ] && [ "$code" -eq 2 ]; then echo "nothing has expired"; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; fi
            # an annotation: the portal reads it to tell the person why the request was refused
            echo "::error title=Request refused::$(tr '\n' ' ' < "$RUNNER_TEMP/err.txt" | cut -c1-400)"
            exit "$code"
          fi
          cat "$RUNNER_TEMP/result.json"
      - name: Check the files
        if: steps.change.outputs.skip != 'true'
        run: |
          files=$(python3 -c "import json,os; print(' '.join(f for f in json.load(open(os.environ['RUNNER_TEMP']+'/result.json'))['files'] if os.path.exists(f)))")
          [ -z "$files" ] || yamllint -c .yamllint.yaml $files
      - name: Open the pull request
        id: pr
        if: steps.change.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_BY: ${{ inputs.requested_by || 'the schedule' }}
          ACTION: ${{ inputs.action || 'expire' }}
        run: |
          python3 - <<'EOF'
          import json, os, subprocess
          r = json.load(open(os.environ["RUNNER_TEMP"] + "/result.json"))
          run_url = f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          closing = "It is merged automatically once the checks pass, and Argo CD applies it; a failed check leaves it open."
          body = f"{r['body']}\n\n---\nRequested by {os.environ['REQUESTED_BY']} through the `selfservice` workflow ([run]({run_url})). {closing}"
          def sh(*a): subprocess.run(a, check=True)
          if os.environ.get("ACTION") == "expire" or r["title"].startswith("remove expired"):
              open_prs = subprocess.run(["gh", "pr", "list", "--state", "open", "--search", "remove expired self-service in:title", "--json", "number"], capture_output=True, text=True, check=True).stdout
              if json.loads(open_prs):
                  print("a pull request that removes expired resources is already open")
                  raise SystemExit(0)
          sh("git", "config", "user.name", "github-actions[bot]")
          sh("git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com")
          sh("git", "checkout", "-b", r["branch"])
          sh("git", "add", "-A", "--", *r["files"])
          sh("git", "commit", "-m", r["title"])
          sh("git", "push", "origin", r["branch"])
          url = subprocess.run(["gh", "pr", "create", "--base", "main", "--head", r["branch"], "--title", r["title"], "--body", body], check=True, capture_output=True, text=True).stdout.strip().splitlines()[-1]
          print("pull request:", url)
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"url={url}\nbranch={r['branch']}\n")
          EOF
      - name: Run the checks on the pull request
        id: checks
        if: steps.pr.outputs.url != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.pr.outputs.branch }}
        run: |
          # lint runs on pull_request events, which the built-in token cannot start: start it by hand on the branch, so the checks show on the pull request
          gh workflow run lint.yaml --ref "$BRANCH"
          id=""
          for i in $(seq 1 30); do
            id=$(gh run list --workflow lint.yaml --branch "$BRANCH" --event workflow_dispatch --limit 1 --json databaseId -q '.[0].databaseId')
            [ -n "$id" ] && break
            sleep 3
          done
          [ -n "$id" ] || { echo "::error title=Checks did not start::the lint workflow did not start on $BRANCH"; exit 1; }
          echo "lint run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$id"
          gh run watch "$id" --exit-status
      - name: Merge the pull request
        if: steps.checks.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.pr.outputs.url }}
        run: |
          # the checks passed: merge now (GitHub's --auto needs branch protection rules on main, which would also block the workflows that push to it)
          gh pr merge "$PR" --squash
