name: lint

on:
  pull_request:
  workflow_dispatch:   # the selfservice workflow starts it on the branch of a pull request it opened (a pull request opened with the built-in token does not trigger pull_request runs)
  push:
    branches: [main]

jobs:
  yaml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: yamllint
        run: pip install yamllint==1.35.1 && yamllint -c .yamllint.yaml .

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install kubeconform
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/
      - name: kubeconform
        run: |
          files=$(find gitops -name '*.yaml' -not -name 'values*.yaml' -not -name kustomization.yaml -not -name 'app-config*.yaml' -not -path '*/files/*' -not -path '*/templates/*' 2>/dev/null || true)
          [ -z "$files" ] && { echo "no manifests yet"; exit 0; }
          kubeconform -summary -ignore-missing-schemas -skip CustomResourceDefinition $files
