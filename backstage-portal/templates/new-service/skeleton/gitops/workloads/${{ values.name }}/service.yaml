apiVersion: v1
kind: ServiceAccount
metadata:
  name: ${{ values.name }}
  namespace: ${{ values.namespace }}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${{ values.name }}
  namespace: ${{ values.namespace }}
  labels: {app.kubernetes.io/name: ${{ values.name }}, app.kubernetes.io/version: "1.0.0", team: ${{ values.owner | replace("group:default/", "") | replace("group:", "") }}}
spec:
  replicas: ${{ values.replicas }}
  revisionHistoryLimit: 5
  strategy:
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels: {app.kubernetes.io/name: ${{ values.name }}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: ${{ values.name }}, app.kubernetes.io/version: "1.0.0", team: ${{ values.owner | replace("group:default/", "") | replace("group:", "") }}}
    spec:
      serviceAccountName: ${{ values.name }}
      automountServiceAccountToken: false
      securityContext:   # Pod Security "restricted" (enforced in demo)
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app.kubernetes.io/name: ${{ values.name }}}
      containers:
        - name: ${{ values.name }}
          image: ${{ values.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: ${{ values.port }}}
          readinessProbe:   # change the path if the service has no /readyz
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            failureThreshold: 3
          resources:   # Kyverno require-limits: a memory limit is mandatory
            requests: {cpu: 50m, memory: ${{ {"128Mi": "64Mi", "256Mi": "128Mi", "512Mi": "256Mi", "1Gi": "512Mi"}[values.memoryLimit] }}}
            limits: {memory: ${{ values.memoryLimit }}}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ${{ values.name }}
  namespace: ${{ values.namespace }}
  labels: {app.kubernetes.io/name: ${{ values.name }}}
spec:
  selector: {app.kubernetes.io/name: ${{ values.name }}}
  ports:
    - {name: http, port: 80, targetPort: http}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ${{ values.name }}
  namespace: ${{ values.namespace }}
spec:
  parentRefs:
    - {name: platform, namespace: traefik}
  hostnames: [${{ values.host }}]
  rules:
    - backendRefs:
        - {name: ${{ values.name }}, port: 80}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ${{ values.name }}
  namespace: ${{ values.namespace }}
spec:
  minAvailable: 1
  selector:
    matchLabels: {app.kubernetes.io/name: ${{ values.name }}}
