kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: platform
networking:
  # kindnet does not enforce NetworkPolicy reliably; bootstrap.py installs Calico instead
  disableDefaultCNI: true
  podSubnet: 192.168.0.0/16
nodes:
  - role: control-plane
    extraPortMappings:
      # host :8080 -> traefik web NodePort, host :8443 -> websecure NodePort
      - {containerPort: 30080, hostPort: 8080, protocol: TCP}
      - {containerPort: 30443, hostPort: 8443, protocol: TCP}
  - role: worker
  - role: worker
