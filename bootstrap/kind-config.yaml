kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: platform
networking:
  # kindnet does not enforce NetworkPolicy reliably; bootstrap.py installs Calico instead
  disableDefaultCNI: true
  podSubnet: 192.168.0.0/16
nodes:
  - role: control-plane
    extraPortMappings:
      # host :8880 -> traefik web NodePort, host :8444 -> websecure NodePort
      - {containerPort: 30080, hostPort: 8880, protocol: TCP}
      - {containerPort: 30443, hostPort: 8444, protocol: TCP}
  - role: worker
  - role: worker
